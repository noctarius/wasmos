name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Zig is needed even by the unit-tests configure (native gfx-compositor /
  # font-service services require it). The version only matters where Zig code is
  # actually compiled (the defconfig builds), not for the unit-tests configure.
  ZIG_VERSION: "0.14.1"
  # TinyGo >= 0.36 supports Go 1.24 (the runner's preinstalled Go); 0.34 rejected it.
  TINYGO_VERSION: "0.41.1"

jobs:
  # Every host of tests/batteries.json that has a CI runner: the unit tests
  # compile kernel headers natively, so an arm64 host exercises paths an
  # x86_64 host never does. aarch64-darwin has no runner (macOS runners are
  # scarce and slow) and is tested locally.
  unit-tests:
    name: Kernel unit tests (${{ matrix.name }})
    needs: batteries
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.batteries.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm ninja-build python3-pip curl xz-utils
          python3 -m pip install --user kconfiglib

      - name: Install Zig
        run: |
          arch=$(uname -m)
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${arch}-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ
          echo "$PWD/zig-${arch}-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      # The Go coroutine test runs on wasm32 through TinyGo, because Go models
      # every record as an opaque blob sized for that target -- a host build
      # would exercise a different ABI. Without TinyGo the unit suite silently
      # loses the one test that catches Go binding drift.
      - name: Install TinyGo
        run: |
          deb="tinygo_${TINYGO_VERSION}_$(dpkg --print-architecture).deb"
          curl -fsSLO "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/${deb}"
          sudo dpkg -i "$deb"

      - name: Install AssemblyScript
        # asc is required at configure time (AssemblyScript serial driver);
        # rustc is preinstalled on the runner.
        run: |
          npm install
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Configure
        run: ./configure out/unit

      - name: Run kernel unit tests
        run: ninja -C out/unit run-kernel-unit-tests

  defconfig:
    name: ${{ matrix.config }} (build + boot)
    # Every configuration in configs/, built in full and booted on its own
    # architecture's runner: an aarch64 configuration on an arm64 runner, whose
    # guest is native to the host's ISA (TCG still, see env below).
    runs-on: ${{ startsWith(matrix.config, 'aarch64_') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        config: [x86_64_warp_single, x86_64_warp_smp, x86_64_wasm3_single, x86_64_wasm3_smp,
                 aarch64_wasm3_single, aarch64_wasm3_smp]
    env:
      # Force TCG (software emulation). wasmos is only validated under TCG (the
      # dev environment is macOS QEMU); under KVM the bootloader->kernel handoff
      # fails ("[kernel] invalid boot_info").
      WASMOS_QEMU_ACCEL: "tcg"
      # Boot outcome is bimodal: a healthy boot halts in ~30 s, a wedged one never
      # recovers. 600 s only made every failure cost ten minutes; 120 s still
      # leaves ~4x headroom over a good boot.
      WASMOS_QEMU_TEST_TIMEOUT: "120"
      # aarch64 under TCG on the arm64 runner is slower than x86_64 on its own;
      # the same factor the integration batteries use there.
      WASMOS_TEST_TIMEOUT_SCALE: ${{ startsWith(matrix.config, 'aarch64_') && '3' || '1' }}
      ARCH: ${{ startsWith(matrix.config, 'aarch64_') && 'aarch64' || 'x86_64' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build + emulation toolchain
        run: |
          if [ "$ARCH" = aarch64 ]; then
            emu="qemu-system-arm qemu-efi-aarch64"
          else
            emu="qemu-system-x86 ovmf"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3-pip curl xz-utils $emu
          python3 -m pip install --user kconfiglib

      - name: Install LLVM 20
        # Ubuntu's default clang 18 mis-handles the x86_64-unknown-uefi target
        # (bootloader codegen: "backend data layout 'e-m:w-...' does not match
        # expected target description 'e-m:e-...'"). A newer LLVM fixes it.
        run: |
          .github/scripts/install-llvm.sh 20
          # /usr/lib/llvm-20/bin has unversioned clang/ld.lld/lld-link/llvm-objcopy.
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

      - name: Install Zig
        # Zig 0.14.1+ uses the zig-<arch>-<os>-<version> tarball naming.
        run: |
          zig="zig-$(uname -m)-linux-${ZIG_VERSION}"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${zig}.tar.xz" | tar -xJ
          echo "$PWD/${zig}" >> "$GITHUB_PATH"

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install TinyGo
        run: |
          deb="tinygo_${TINYGO_VERSION}_$(dpkg --print-architecture).deb"
          curl -fsSLO "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/${deb}"
          sudo dpkg -i "${deb}"

      - name: Install AssemblyScript
        run: |
          npm install
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Stage OVMF (writable vars copy)
        # Ubuntu's ovmf package ships OVMF_CODE_4M.fd / OVMF_VARS_4M.fd, which the
        # firmware autodiscovery list does not know about, and the vars file must be
        # writable for QEMU. Copy a matched pair to a writable location. aarch64
        # uses QEMU's AAVMF, which configure finds itself.
        if: env.ARCH != 'aarch64'
        run: |
          mkdir -p "$RUNNER_TEMP/ovmf"
          code=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1)
          vars=$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -1)
          echo "OVMF code=$code vars=$vars"
          cp "$code" "$RUNNER_TEMP/ovmf/OVMF_CODE.fd"
          cp "$vars" "$RUNNER_TEMP/ovmf/OVMF_VARS.fd"
          chmod u+w "$RUNNER_TEMP/ovmf/OVMF_VARS.fd"

      - name: Tool versions
        run: |
          clang --version | head -1; ld.lld --version | head -1
          "qemu-system-$ARCH" --version | head -1
          zig version; rustc --version; tinygo version || true
          asc --version || true

      - name: Configure (${{ matrix.config }})
        run: |
          if [ "$ARCH" = aarch64 ]; then
            ./configure "out/${{ matrix.config }}" "configs/${{ matrix.config }}_defconfig"
          else
            ./configure "out/${{ matrix.config }}" "configs/${{ matrix.config }}_defconfig" \
              --ovmf-code="$RUNNER_TEMP/ovmf/OVMF_CODE.fd" \
              --ovmf-vars="$RUNNER_TEMP/ovmf/OVMF_VARS.fd"
          fi

      # WASMOS_QEMU_TEST_TIMEOUT (job env) sets the halt test's budget.
      - name: Build + boot test (${{ matrix.config }})
        run: ninja -C "out/${{ matrix.config }}" run-qemu-test

      # The only gate that exercises cross-CPU work stealing under load, so it
      # runs on the SMP configs alone. Turning WASMOS_SCHED_SMP_STRESS on in the
      # tree that just booted rebuilds the kernel and nothing else; the boot test
      # above has already run against the kernel without it.
      - name: SMP scheduler stress test (${{ matrix.config }})
        if: endsWith(matrix.config, '_smp')
        run: |
          ./configure "out/${{ matrix.config }}" --set WASMOS_SCHED_SMP_STRESS=y
          ninja -C "out/${{ matrix.config }}" run-qemu-sched-stress-test

  # The battery list comes from tests/batteries.json so the matrix and the test
  # runner share one source. Adding a battery there adds a runner here; nothing
  # in this file enumerates them.
  batteries:
    name: Resolve test batteries
    runs-on: ubuntu-24.04
    outputs:
      qemu: ${{ steps.resolve.outputs.qemu }}
      host: ${{ steps.resolve.outputs.host }}
      hosts: ${{ steps.resolve.outputs.hosts }}
    steps:
      - uses: actions/checkout@v4
      # --matrix is the script's own view of tests/batteries.json, including the
      # architecture and runtime axes, so no list is written out again here.
      - id: resolve
        run: |
          python3 scripts/run_unittest_suite.py --verify-batteries
          cells=$(python3 scripts/run_unittest_suite.py --matrix)
          echo "qemu=$(printf '%s' "$cells" | python3 -c "import json,sys;print(json.dumps([c for c in json.load(sys.stdin) if c['needs_qemu']]))")" >> "$GITHUB_OUTPUT"
          echo "host=$(printf '%s' "$cells" | python3 -c "import json,sys;print(json.dumps([c['battery'] for c in json.load(sys.stdin) if not c['needs_qemu']]))")" >> "$GITHUB_OUTPUT"
          echo "hosts=$(python3 scripts/run_unittest_suite.py --host-matrix)" >> "$GITHUB_OUTPUT"

  # Batteries that boot nothing: no emulation toolchain, no OVMF, seconds not
  # minutes. Kept off the QEMU runners so they cannot queue behind them.
  host-tests:
    name: ${{ matrix.battery }} (host)
    needs: batteries
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        battery: ${{ fromJSON(needs.batteries.outputs.host) }}
    steps:
      - uses: actions/checkout@v4
      # Built with cc directly rather than through ./configure. A configure
      # resolves the CROSS toolchain -- it fails on llvm-objcopy before it ever
      # reaches this tool -- and installing LLVM to compile one self-contained
      # host program would cost more than the battery saves.
      #
      # This holds only because scripts/make_wasmos_app.c needs nothing beyond
      # libc and the vendored Monocypher (package signatures), both plain C. If
      # it ever gains a project header, build it through ./configure and ninja
      # here and install the toolchain to match.
      - name: Build the packer
        run: |
          mkdir -p out/default
          cc -O2 -Ilibs/monocypher/src -Ilibs/monocypher/src/optional \
            -o out/default/make_wasmos_app scripts/make_wasmos_app.c \
            libs/monocypher/src/monocypher.c \
            libs/monocypher/src/optional/monocypher-ed25519.c
      - name: Run battery (${{ matrix.battery }})
        run: python3 scripts/run_unittest_suite.py --battery "${{ matrix.battery }}"

  # Every battery runs under EVERY wasm runtime. The two are different enough to
  # break independently -- wasm3 interprets and runs in-kernel, WARP JITs to
  # ring 3 -- so a green on one says nothing about the other. Running only WARP
  # is what let a wasm3-only breakage sit unnoticed: a guest mapping that
  # aliases under WARP but not under wasm3 looks identical in a WARP-only run.
  # An aarch64 cell runs on an arm64 runner, so the guest is native to the
  # host's ISA (TCG still, see below); its toolchain is the arm64 build of each
  # tool, and its firmware is QEMU's own AAVMF, which configure finds itself.
  integration-tests:
    name: ${{ matrix.battery }} (QEMU, ${{ matrix.runtime }})
    needs: batteries
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      # One cell's failure must not cancel the others: the whole point is to
      # learn which subsystems are red, and under which runtime, in a single run.
      fail-fast: false
      matrix:
        # Cells come from the manifest already paired with their runtime, so the
        # cross product is not restated here.
        include: ${{ fromJSON(needs.batteries.outputs.qemu) }}
    env:
      # See defconfig job: wasmos only boots correctly under TCG, not KVM.
      WASMOS_QEMU_ACCEL: "tcg"
      # A runner is far slower than a developer's machine: boots that take 12s
      # locally have exceeded 120s here, failing tests that were never wrong.
      # Scale the framework's deadlines rather than editing 33 tests' literals,
      # which would slow local runs for a problem they do not have.
      WASMOS_TEST_TIMEOUT_SCALE: "3"
      # The emulator the battery boots, for the crash-core steps below.
      QEMU_BIN: ${{ matrix.arch == 'aarch64' && 'qemu-system-aarch64' || 'qemu-system-x86_64' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build + emulation toolchain
        run: |
          if [ "${{ matrix.arch }}" = aarch64 ]; then
            emu="qemu-system-arm qemu-efi-aarch64"
          else
            emu="qemu-system-x86 ovmf"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build python3-pip curl xz-utils $emu
          python3 -m pip install --user kconfiglib

      - name: Install LLVM 20
        run: |
          .github/scripts/install-llvm.sh 20
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

      - name: Install Zig
        run: |
          zig="zig-$(uname -m)-linux-${ZIG_VERSION}"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${zig}.tar.xz" | tar -xJ
          echo "$PWD/${zig}" >> "$GITHUB_PATH"

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install TinyGo
        run: |
          deb="tinygo_${TINYGO_VERSION}_$(dpkg --print-architecture).deb"
          curl -fsSLO "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/${deb}"
          sudo dpkg -i "${deb}"

      - name: Install AssemblyScript
        run: |
          npm install
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Stage OVMF (writable vars copy)
        if: matrix.arch != 'aarch64'
        run: |
          mkdir -p "$RUNNER_TEMP/ovmf"
          code=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1)
          vars=$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -1)
          cp "$code" "$RUNNER_TEMP/ovmf/OVMF_CODE.fd"
          cp "$vars" "$RUNNER_TEMP/ovmf/OVMF_VARS.fd"
          chmod u+w "$RUNNER_TEMP/ovmf/OVMF_VARS.fd"

      # The runtime is pinned by the defconfig the build directory is seeded
      # from (skills/wasmos-build-and-run).
      - name: Configure (${{ matrix.runtime }})
        run: |
          if [ "${{ matrix.arch }}" = aarch64 ]; then
            ./configure out/build "configs/${{ matrix.runtime }}_defconfig"
          else
            ./configure out/build "configs/${{ matrix.runtime }}_defconfig" \
              --ovmf-code="$RUNNER_TEMP/ovmf/OVMF_CODE.fd" \
              --ovmf-vars="$RUNNER_TEMP/ovmf/OVMF_VARS.fd"
          fi

      # QEMU itself has crashed with SIGSEGV mid-battery (docs/TASKS.md, the P0
      # "no CLI prompt" item, second face). Its core is the only evidence of
      # where, so cores land in a runner-owned directory rather than apport,
      # which discards crashes of binaries it does not track. Cores are named by
      # executable path (%E), not by %e: %e is the crashing THREAD's name, which
      # for a QEMU vCPU is "CPU 0/TCG". A canary crash proves the capture works,
      # so no QEMU core after the battery means QEMU did not crash rather than
      # that nothing was collected. The canary signals itself, so the core is
      # written by the shell that sent the signal with no fork/exec window.
      - name: Collect QEMU core dumps
        run: |
          mkdir -p "$RUNNER_TEMP/cores"
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/cores/core.%E.%p"
          ulimit -c unlimited
          sh -c 'kill -SEGV $$' || true
          shopt -s nullglob
          canary=("$RUNNER_TEMP"/cores/core.*)
          if [ ${#canary[@]} -eq 0 ]; then
            echo "::error::core capture is not working (core_pattern=$(cat /proc/sys/kernel/core_pattern), ulimit -c=$(ulimit -c))"
            exit 1
          fi
          echo "canary core: ${canary[*]}"
          rm -f "${canary[@]}"

      # WASMOS_TEST_BATTERY selects the battery inside the existing target, so
      # the ESP staging and QEMU wiring stay in one place rather than being
      # duplicated per battery.
      # Teed so the next step can assert what actually booted. pipefail is set
      # explicitly because the default shell here is `bash -e` without it, and
      # tee would otherwise swallow a battery failure.
      - name: Run battery (${{ matrix.battery }}, ${{ matrix.runtime }})
        env:
          WASMOS_TEST_BATTERY: ${{ matrix.battery }}
        run: |
          set -o pipefail
          ulimit -c unlimited
          ninja -C out/build run-qemu-cli-test 2>&1 | tee "$RUNNER_TEMP/battery.log"

      # Symbols come from Ubuntu's debuginfod, so the backtrace names QEMU's own
      # functions without a debug build. Only QEMU's cores are reported as QEMU
      # crashes; a core from any other process is named as such and kept.
      - name: Backtrace QEMU crashes
        if: always()
        run: |
          shopt -s nullglob
          for other in "$RUNNER_TEMP"/cores/core.*; do
            case "$other" in
              *"$QEMU_BIN".*) ;;
              *) echo "::warning::a process other than QEMU dumped core: $other" ;;
            esac
          done
          cores=("$RUNNER_TEMP"/cores/core.*"$QEMU_BIN".*)
          if [ ${#cores[@]} -eq 0 ]; then
            echo "no QEMU core dumps"
            exit 0
          fi
          sudo apt-get install -y --no-install-recommends gdb
          export DEBUGINFOD_URLS="https://debuginfod.ubuntu.com"
          for core in "${cores[@]}"; do
            echo "::error::QEMU crashed: $core"
            gdb -batch -iex "set debuginfod enabled on" \
              -ex "info sharedlibrary" -ex "bt full" -ex "thread apply all bt" \
              "$(command -v "$QEMU_BIN")" "$core" 2>&1 | tee "$core.bt.txt"
            zstd -q -T0 --rm "$core"
          done

      - name: Upload QEMU crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-crash-${{ matrix.battery }}-${{ matrix.runtime }}
          path: ${{ runner.temp }}/cores/
          if-no-files-found: ignore
          retention-days: 14

      # A battery passes under whichever runtime the build actually linked, so
      # assert it is the one this cell claims. The marker comes from the BOOTED
      # kernel, which is the only source that cannot be stale: a build directory
      # can carry an edited .config, and an ESP can serve a kernel older than the
      # tree it was built from.
      - name: Confirm the runtime under test
        run: |
          case "${{ matrix.runtime }}" in
            *warp_*)  want=WARP ;;
            *wasm3_*) want=WASM3 ;;
          esac
          if ! grep -qE "register request=WASM runtime=$want\b" "$RUNNER_TEMP/battery.log"; then
            echo "::error::expected runtime=$want, but the boot log says:"
            grep -E "register request=WASM runtime=" "$RUNNER_TEMP/battery.log" || \
              echo "(no runtime registration marker at all)"
            exit 1
          fi
