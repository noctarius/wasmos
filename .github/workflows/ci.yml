name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Zig is needed even by the unit-tests configure (native gfx-compositor /
  # font-service services require it). The version only matters where Zig code is
  # actually compiled (the defconfig builds), not for the unit-tests configure.
  ZIG_VERSION: "0.14.1"
  # TinyGo >= 0.36 supports Go 1.24 (the runner's preinstalled Go); 0.34 rejected it.
  TINYGO_VERSION: "0.41.1"

jobs:
  unit-tests:
    name: Kernel unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm cmake ninja-build python3-pip curl xz-utils
          python3 -m pip install --user kconfiglib

      - name: Install Zig
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      # The Go coroutine test runs on wasm32 through TinyGo, because Go models
      # every record as an opaque blob sized for that target -- a host build
      # would exercise a different ABI. Without TinyGo the unit suite silently
      # loses the one test that catches Go binding drift.
      - name: Install TinyGo
        run: |
          curl -fsSLO "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb"
          sudo dpkg -i "tinygo_${TINYGO_VERSION}_amd64.deb"

      - name: Install AssemblyScript
        # asc is required at configure time (AssemblyScript serial driver);
        # rustc is preinstalled on the runner.
        run: |
          npm install
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build

      - name: Run kernel unit tests
        run: cmake --build build --target run-kernel-unit-tests

  defconfig:
    name: ${{ matrix.config }} (build + boot)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [warp_single, warp_smp, wasm3_single, wasm3_smp]
    env:
      # Force TCG (software emulation). wasmos is only validated under TCG (the
      # dev environment is macOS QEMU); under KVM the bootloader->kernel handoff
      # fails ("[kernel] invalid boot_info").
      WASMOS_QEMU_ACCEL: "tcg"
      # Boot outcome is bimodal: a healthy boot halts in ~30 s, a wedged one never
      # recovers. 600 s only made every failure cost ten minutes; 120 s still
      # leaves ~4x headroom over a good boot.
      WASMOS_QEMU_TEST_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4

      - name: Install build + emulation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3-pip \
            qemu-system-x86 ovmf curl xz-utils
          python3 -m pip install --user kconfiglib

      - name: Install LLVM 20
        # Ubuntu's default clang 18 mis-handles the x86_64-unknown-uefi target
        # (bootloader codegen: "backend data layout 'e-m:w-...' does not match
        # expected target description 'e-m:e-...'"). A newer LLVM fixes it.
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20 all
          # /usr/lib/llvm-20/bin has unversioned clang/ld.lld/lld-link/llvm-objcopy.
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

      - name: Install Zig
        # Zig 0.14.1+ uses the zig-<arch>-<os>-<version> tarball naming.
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install TinyGo
        run: |
          curl -fsSLO "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb"
          sudo dpkg -i "tinygo_${TINYGO_VERSION}_amd64.deb"

      - name: Install AssemblyScript
        run: |
          npm install
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Stage OVMF (writable vars copy)
        # Ubuntu's ovmf package ships OVMF_CODE_4M.fd / OVMF_VARS_4M.fd, which the
        # CMake autodiscovery list does not know about, and the vars file must be
        # writable for QEMU. Copy a matched pair to a writable location.
        run: |
          mkdir -p "$RUNNER_TEMP/ovmf"
          code=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1)
          vars=$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -1)
          echo "OVMF code=$code vars=$vars"
          cp "$code" "$RUNNER_TEMP/ovmf/OVMF_CODE.fd"
          cp "$vars" "$RUNNER_TEMP/ovmf/OVMF_VARS.fd"
          chmod u+w "$RUNNER_TEMP/ovmf/OVMF_VARS.fd"

      - name: Tool versions
        run: |
          clang --version | head -1; ld.lld --version | head -1
          qemu-system-x86_64 --version | head -1
          zig version; rustc --version; tinygo version || true
          asc --version || true

      - name: Configure (${{ matrix.config }})
        run: |
          cmake -S . -B "build-${{ matrix.config }}" \
            -DWASMOS_DOTCONFIG="configs/${{ matrix.config }}_defconfig" \
            -DWASMOS_QEMU_TEST_TIMEOUT="${WASMOS_QEMU_TEST_TIMEOUT}" \
            -DOVMF_CODE="$RUNNER_TEMP/ovmf/OVMF_CODE.fd" \
            -DOVMF_VARS="$RUNNER_TEMP/ovmf/OVMF_VARS.fd"

      - name: Build + boot test (${{ matrix.config }})
        run: cmake --build "build-${{ matrix.config }}" --target run-qemu-test

  # The battery list comes from tests/batteries.json so the matrix and the test
  # runner share one source. Adding a battery there adds a runner here; nothing
  # in this file enumerates them.
  batteries:
    name: Resolve test batteries
    runs-on: ubuntu-latest
    outputs:
      qemu: ${{ steps.resolve.outputs.qemu }}
      host: ${{ steps.resolve.outputs.host }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        run: |
          python3 scripts/run_unittest_suite.py --verify-batteries
          echo "qemu=$(python3 -c "import json;print(json.dumps([b['name'] for b in json.load(open('tests/batteries.json'))['batteries'] if b['needs_qemu']]))")" >> "$GITHUB_OUTPUT"
          echo "host=$(python3 -c "import json;print(json.dumps([b['name'] for b in json.load(open('tests/batteries.json'))['batteries'] if not b['needs_qemu']]))")" >> "$GITHUB_OUTPUT"

  # Batteries that boot nothing: no emulation toolchain, no OVMF, seconds not
  # minutes. Kept off the QEMU runners so they cannot queue behind them.
  host-tests:
    name: ${{ matrix.battery }} (host)
    needs: batteries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        battery: ${{ fromJSON(needs.batteries.outputs.host) }}
    steps:
      - uses: actions/checkout@v4
      # Built with cc directly rather than through CMake. A full configure
      # validates the CROSS toolchain -- it fails on llvm-objcopy before it ever
      # reaches this tool -- and installing LLVM to compile one self-contained
      # host program would cost more than the battery saves.
      #
      # This holds only because scripts/make_wasmos_app.c includes nothing but
      # libc. If it ever gains a project header, build it through CMake here and
      # install the toolchain to match.
      - name: Build the packer
        run: |
          mkdir -p build
          cc -O2 -o build/make_wasmos_app scripts/make_wasmos_app.c
      - name: Run battery (${{ matrix.battery }})
        run: python3 scripts/run_unittest_suite.py --battery "${{ matrix.battery }}"

  integration-tests:
    name: ${{ matrix.battery }} (QEMU)
    needs: batteries
    runs-on: ubuntu-latest
    strategy:
      # One battery's failure must not cancel the others: the whole point is to
      # learn which subsystems are red in a single run.
      fail-fast: false
      matrix:
        battery: ${{ fromJSON(needs.batteries.outputs.qemu) }}
    env:
      # See defconfig job: wasmos only boots correctly under TCG, not KVM.
      WASMOS_QEMU_ACCEL: "tcg"
    steps:
      - uses: actions/checkout@v4

      - name: Install build + emulation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3-pip \
            qemu-system-x86 ovmf curl xz-utils
          python3 -m pip install --user kconfiglib

      - name: Install LLVM 20
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20 all
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

      - name: Install Zig
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install TinyGo
        run: |
          curl -fsSLO "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo_${TINYGO_VERSION}_amd64.deb"
          sudo dpkg -i "tinygo_${TINYGO_VERSION}_amd64.deb"

      - name: Install AssemblyScript
        run: |
          npm install
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Stage OVMF (writable vars copy)
        run: |
          mkdir -p "$RUNNER_TEMP/ovmf"
          code=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1)
          vars=$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -1)
          cp "$code" "$RUNNER_TEMP/ovmf/OVMF_CODE.fd"
          cp "$vars" "$RUNNER_TEMP/ovmf/OVMF_VARS.fd"
          chmod u+w "$RUNNER_TEMP/ovmf/OVMF_VARS.fd"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DWASMOS_DOTCONFIG="configs/warp_smp_defconfig" \
            -DOVMF_CODE="$RUNNER_TEMP/ovmf/OVMF_CODE.fd" \
            -DOVMF_VARS="$RUNNER_TEMP/ovmf/OVMF_VARS.fd"

      # WASMOS_TEST_BATTERY selects the battery inside the existing target, so
      # the ESP staging and QEMU wiring stay in one place rather than being
      # duplicated per battery.
      - name: Run battery (${{ matrix.battery }})
        env:
          WASMOS_TEST_BATTERY: ${{ matrix.battery }}
        run: cmake --build build --target run-qemu-cli-test
