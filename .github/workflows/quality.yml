name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match ci.yml: apt clang mishandles the UEFI target, so use apt.llvm.org.
  LLVM_VERSION: "20"
  ZIG_VERSION: "0.14.1"
  # Pin the Python tools: their defaults drift between releases (e.g. ruff 0.16
  # began selecting new rule categories by default), which silently changes what
  # `lint`/`fmt-check` enforce. Bump deliberately alongside any ruff.toml change.
  BLACK_VERSION: "26.5.1"
  RUFF_VERSION: "0.16.1"
  PYYAML_VERSION: "6.0.2"

jobs:
  format-and-lint:
    name: Format + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3-pip curl xz-utils git

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${LLVM_VERSION}" all
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Fetch clang-tidy plugin headers
        # apt.llvm.org ships the clang-tidy binary but not its dev headers
        # (clang-tidy/ClangTidyCheck.h etc.), which the wasmos plugin compiles
        # against. Sparse-checkout just those headers from the matching LLVM
        # release branch; the clang/llvm headers come from the -dev packages
        # installed above.
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "release/${LLVM_VERSION}.x" \
            https://github.com/llvm/llvm-project.git /tmp/llvm-project
          git -C /tmp/llvm-project sparse-checkout set clang-tools-extra/clang-tidy
          echo "TIDY_INCLUDE=/tmp/llvm-project/clang-tools-extra" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Add Rust wasm32 target + rustfmt
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt

      - name: Install Zig
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      # PyYAML is what makes the ABI drift gate real: without it every
      # gen_abi_*.py --check/--verify-source SKIPS instead of comparing, so a
      # generated file could disagree with its IDL and Quality would still pass.
      #
      - name: Install Python format/lint tools
        run: |
          pip install "black==${BLACK_VERSION}" "ruff==${RUFF_VERSION}" \
            "PyYAML==${PYYAML_VERSION}"

      # clang-format is pinned SEPARATELY from LLVM_VERSION, because formatting
      # is not stable across clang-format majors -- 20 arranges a short braced
      # list into a column grid where 22 does not -- so tying it to whatever
      # major the compiler needs makes the gate unreproducible for anyone whose
      # local LLVM differs. The pin lives in .clang-format-version, which
      # scripts/quality.sh also reads and enforces.
      #
      # Installed into its OWN venv, which is the point of this step. This
      # runner image already ships a pip clang-format in the tool cache, so a
      # plain `pip install` writes one version while `import clang_format`
      # resolves another, and CLANG_FORMAT ends up naming a 20.1.8 package after
      # 22.1.0 was installed successfully. A venv contains exactly one
      # clang_format, so resolving through its interpreter cannot pick the wrong
      # one. The path is the binary the wheel bundles, not a scripts directory
      # that merely ought to contain it -- and not `command -v`, which finds the
      # LLVM toolchain copy because its bin is earlier on PATH.
      - name: Install pinned clang-format
        run: |
          python -m venv /tmp/clang-format-venv
          /tmp/clang-format-venv/bin/pip install --quiet \
            "clang-format==$(tr -d '[:space:]' < .clang-format-version)"
          echo "CLANG_FORMAT=$(/tmp/clang-format-venv/bin/python -c 'import clang_format, os; print(os.path.join(os.path.dirname(clang_format.__file__), "data", "bin", "clang-format"))')" >> "$GITHUB_ENV"

      # asc is needed both at configure time and by the AssemblyScript linter.
      - name: Install AssemblyScript compiler
        run: |
          npm install
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          "${CLANG_FORMAT}" --version; clang-tidy --version | head -1
          zig version; go version; rustc --version; node --version
          black --version; ruff --version; asc --version || true

      # Discovers the toolchain, exports compile_commands.json, and sets up the
      # clang-tidy plugin build (pointed at the fetched headers). Both targets
      # below depend on this.
      - name: Configure
        run: cmake -S . -B build -DWASMOS_CLANG_TIDY_INCLUDE_DIR="$TIDY_INCLUDE"

      # Run the formatter in place; any resulting diff means something was not
      # formatted before commit -> fail with the offending files.
      - name: Format (fail if it changes anything)
        run: |
          cmake --build build --target fmt
          if ! git diff --quiet; then
            echo "::error::Formatter produced changes. Run 'cmake --build build --target fmt' locally and commit the result."
            git --no-pager diff
            exit 1
          fi

      # Builds the wasmos clang-tidy plugin, then runs every language linter; any
      # clang-tidy error (e.g. wasmos-standalone-block) or other linter failure
      # fails the job. Runs even if the format step failed so a PR sees both.
      - name: Lint (fail on any error)
        if: ${{ !cancelled() }}
        run: cmake --build build --target lint
