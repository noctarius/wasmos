name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match ci.yml: apt clang mishandles the UEFI target, so use apt.llvm.org.
  LLVM_VERSION: "20"
  ZIG_VERSION: "0.14.1"

jobs:
  format-and-lint:
    name: Format + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3-pip curl xz-utils git

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${LLVM_VERSION}" all
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Fetch clang-tidy plugin headers
        # apt.llvm.org ships the clang-tidy binary but not its dev headers
        # (clang-tidy/ClangTidyCheck.h etc.), which the wasmos plugin compiles
        # against. Sparse-checkout just those headers from the matching LLVM
        # release branch; the clang/llvm headers come from the -dev packages
        # installed above.
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "release/${LLVM_VERSION}.x" \
            https://github.com/llvm/llvm-project.git /tmp/llvm-project
          git -C /tmp/llvm-project sparse-checkout set clang-tools-extra/clang-tidy
          echo "TIDY_INCLUDE=/tmp/llvm-project/clang-tools-extra" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Add Rust wasm32 target + rustfmt
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt

      - name: Install Zig
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install Python format/lint tools
        run: pip install black ruff

      # asc is needed both at configure time and by the AssemblyScript linter.
      - name: Install AssemblyScript compiler
        run: |
          npm install
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          clang-format --version; clang-tidy --version | head -1
          zig version; go version; rustc --version; node --version
          black --version; ruff --version; asc --version || true

      # Discovers the toolchain, exports compile_commands.json, and sets up the
      # clang-tidy plugin build (pointed at the fetched headers). Both targets
      # below depend on this.
      - name: Configure
        run: cmake -S . -B build -DWASMOS_CLANG_TIDY_INCLUDE_DIR="$TIDY_INCLUDE"

      # Run the formatter in place; any resulting diff means something was not
      # formatted before commit -> fail with the offending files.
      - name: Format (fail if it changes anything)
        run: |
          cmake --build build --target fmt
          if ! git diff --quiet; then
            echo "::error::Formatter produced changes. Run 'cmake --build build --target fmt' locally and commit the result."
            git --no-pager diff
            exit 1
          fi

      # Builds the wasmos clang-tidy plugin, then runs every language linter; any
      # clang-tidy error (e.g. wasmos-standalone-block) or other linter failure
      # fails the job. Runs even if the format step failed so a PR sees both.
      - name: Lint (fail on any error)
        if: ${{ !cancelled() }}
        run: cmake --build build --target lint
