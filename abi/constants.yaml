# Value constants of the WASMOS ABI.
#
# This IDL owns the plain VALUES a peer must pass or interpret: socket families
# and types, flag bits, structure versions, size ceilings. It is the third axis
# of the ABI alongside abi/opcodes.yaml (the positive `type` field of a message)
# and abi/errors.yaml (the negative packed status codes).
#
# It exists because those two were generated for every language while the values
# they are used with were not. An app could name NET_IPC_SOCKET_OPEN in Rust, Go,
# Zig or AssemblyScript, but had to hard-code the `2` and `1` it passes in the
# open descriptor, because the family and type were a C enum in
# src/drivers/include/wasmos_driver_abi.h that only C can include.
#
# A group becomes one commented block per language. `bits: true` marks a group
# whose members are OR-able flags rather than alternatives, which is documented
# rather than enforced. Values are decimal or 0x-hex; the generator emits them in
# the form given here so a bit constant stays readable as a bit.
#
# See docs/architecture/34-abi-idl-and-error-model.md.
abi_version: 1

groups:
  - name: block_backend
    doc: |
      Which kind of backend serves a block device, carried in the `backend`
      field of wasmos_block_descriptor_t and matched by `DRIVER==` in a block
      rule.

      What a unit MEANS is the backend's own business -- ATA numbers the drives
      on a controller, a virtio-blk device numbers itself by where it sits on the
      bus -- so a bare unit names two different disks once more than one backend
      is present. Backend and unit are both intrinsic rather than allocated: they
      do not depend on which driver finished probing first, which a number handed
      out in publish order would.

      Neither is the device's IDENTITY. That is the descriptor's canonical_id
      string (`block:pci:00:01.01:ata0`), and the `block` service class instance
      is an opaque FNV-1a 32 fingerprint of it. The fingerprint carries no
      decodable structure on purpose: every attribute a caller might want to
      match on lives in the descriptor, where adding one costs a field rather
      than a redefinition of what the instance number means.
    constants:
      - { symbol: BLOCK_BACKEND_UNKNOWN, value: 0, doc: "Publisher named no backend." }
      - { symbol: BLOCK_BACKEND_ATA, value: 1, doc: "ATA/IDE controller; unit is the drive index." }
      - symbol: BLOCK_BACKEND_VIRTIO_BLK
        value: 2
        doc: |
          virtio-blk PCI device. One device is one disk, so the unit identifies
          the DEVICE rather than a drive on it: it is (slot << 3) | function,
          the same packing as the BDF, which fits a unit's eight bits exactly.
          Two virtio-blk devices therefore get different units instead of
          colliding on one class instance.

  - name: block_descriptor
    doc: |
      Version and size ceilings of wasmos_block_descriptor_t, the record that
      describes one block device. The struct itself is declared in
      src/drivers/include/wasmos_driver_abi.h and mirrored in
      src/libc/zig/driver.zig; only the values a peer must agree on live here.

      A reader MUST reject a descriptor whose version it does not know rather
      than interpreting the fields it recognizes, because a future version may
      redefine what an older field means and a partial read is worse than no
      read.
    constants:
      - { symbol: BLOCK_DESCRIPTOR_VERSION, value: 1, doc: "Current wasmos_block_descriptor_t layout." }
      - symbol: BLOCK_DESCRIPTOR_LABEL_MAX
        value: 144
        doc: |
          Bytes reserved for the partition label, NUL included. A GPT name is 36
          UTF-16 code units, which reach 3 bytes each in UTF-8 -- a code point
          needing 4 bytes lies outside the BMP and costs two code units, so it
          never exceeds that rate. 109 bytes is the bound; 144 keeps the
          descriptor's fixed head a multiple of 8 with room to spare, so no
          encoder ever has to truncate a name the format can express.
      - symbol: BLOCK_DESCRIPTOR_ID_MAX
        value: 64
        doc: |
          Bytes reserved for canonical_id, NUL included. The longest form is the
          PCI-addressed partition (`block:pci:BB:DD.FF:ata0p128`), which leaves
          room to spare; a producer that would overflow it must fail rather than
          truncate, because a truncated id is a DIFFERENT device's name.

  - name: block_request
    doc: |
      Version and destination kinds of wasmos_block_request_t, the record that
      describes one block transfer. The struct is declared in
      src/drivers/include/wasmos_driver_abi.h and mirrored in
      src/libc/zig/driver.zig.

      A transfer used to be described by four IPC argument words, which is what
      forced a 32-bit LBA (a 2 TiB ceiling), a `(borrow_id << 12) | count`
      packing, and a SECOND opcode -- BLOCK_IPC_READ_ZC_REQ -- whose only reason
      to exist was that a transfer-buffer destination could not be spelled in the
      words left over. As a field, the destination is a choice within one
      protocol rather than a protocol of its own.

      The request describes WHERE data goes; it never carries the data. Payload
      still lands directly in the named destination, which is what keeps a
      transfer zero-copy.
    constants:
      - { symbol: BLOCK_REQUEST_VERSION, value: 1, doc: "Current wasmos_block_request_t layout." }
      - symbol: BLOCK_DST_BLOCK_BUFFER
        value: 0
        doc: |
          Destination is the caller's per-process block buffer, named by the
          physical address wasmos_block_buffer_phys() returns. The backend moves
          bytes straight there, so neither side copies.
      - symbol: BLOCK_DST_XFER_BUFFER
        value: 1
        doc: |
          Destination is a transfer buffer the caller owns and has reborrowed to
          the backend. The request names it TWICE because the two ways a backend
          can reach it are addressed differently: dst_buffer_id names the OBJECT,
          which xfer_buffer read/write take (the kernel admits the owner or any
          grantee), and dst_borrow_id names the GRANT, which dma_map_borrow
          takes, and which is what lets a bus-master device write the caller's
          pages directly. A backend that cannot do DMA ignores the borrow and
          writes through the object.

          Only WHOLE sectors may be requested: a partial sector would overwrite
          bytes around it that the caller did not ask for, so callers stage head
          and tail remainders through a block-buffer destination.

  - name: partition_scheme
    doc: |
      Which partition table a disk carries, reported in the `scheme` field of
      wasmos_block_descriptor_t.

      NONE is a first-class answer, not an error: a disk may hold a filesystem
      at LBA 0 with no table at all, and that disk mounts. It is a matchable
      state (`ATTR{scheme}=="none"`) rather than a fallback branch in code.

      The scheme decides which identity fields are populated. GPT fills
      type_guid, part_guid and label; MBR fills mbr_type and nothing else, so an
      MBR partition cannot name its own mount point and needs a rule to say
      where it goes.
    constants:
      - { symbol: PARTITION_SCHEME_NONE, value: 0, doc: "No table; the whole device is one volume." }
      - { symbol: PARTITION_SCHEME_MBR, value: 1, doc: "Legacy MBR at LBA 0; four slots, type bytes, no labels." }
      - { symbol: PARTITION_SCHEME_GPT, value: 2, doc: "GPT header at LBA 1; type GUIDs, PARTUUIDs and labels." }

  - name: fs_type
    doc: |
      WHICH FILESYSTEM, in one namespace shared by every producer of the answer.
      Carried in the `fs_type` field of wasmos_block_descriptor_t and
      wasmos_volume_descriptor_t, and reported by a filesystem backend in
      FSMGR_IPC_BACKEND_INFO_RESP arg1.

      Two kinds of producer emit these, and the difference decides which values
      each can emit:

      - A RECOGNISER probing a block device emits only the ON-DISK subset (FAT,
        WFS). This is what a SUPERBLOCK PROBE found, not what a partition type
        claims. The two are reported side by side because neither is sufficient
        alone: a GPT type GUID of Microsoft Basic Data is carried by FAT, NTFS
        and exFAT volumes alike and so identifies nothing, while a probe cannot
        distinguish an EFI System Partition from any other FAT volume. A rule may
        require both.
      - A BACKEND self-reports what it serves, and may name a PSEUDO-FILESYSTEM
        (INITFS, and a future devfs or sysfs) that sits on no block device and
        that no recogniser can ever return.

      A pseudo-filesystem therefore belongs in this enum rather than beside it:
      naming a mount is one lookup for every filesystem, and a filesystem that is
      not on a disk is a value here, not a special case at each call site. It is
      correspondingly meaningless in a `SUBSYSTEM=="volume"` rule -- a volume is a
      formatted block device, so a rule spelling a pseudo-filesystem could never
      match, and the rule parser does not accept one.

      UNKNOWN means no probe matched and the backend named nothing, which is not
      the same as no filesystem -- an unrecognized format reads exactly like an
      empty one from here.
    constants:
      - { symbol: FS_TYPE_UNKNOWN, value: 0, doc: "No superblock probe matched, and no backend named a filesystem." }
      - { symbol: FS_TYPE_FAT, value: 1, doc: "FAT12/16/32; BPB with a 0x55AA boot signature." }
      - { symbol: FS_TYPE_WFS, value: 2, doc: "WFS; superblock magic 'WFS1' at byte 1024 of the volume (docs/WFS_WASMOS_FILE_SYSTEM.md section 4)." }
      - { symbol: FS_TYPE_INITFS, value: 3, doc: "initfs; the boot-image filesystem served from memory. Pseudo-filesystem: self-reported by its backend, never returned by a recogniser." }

  - name: block_descriptor_flags
    bits: true
    doc: |
      Bits of the `flags` field of wasmos_block_descriptor_t.

      PRESENT distinguishes a device that exists from a registry slot that
      merely once described one; a publisher clearing it is how a disk is
      retired.
    constants:
      - { symbol: BLOCK_DESCRIPTOR_FLAG_PRESENT, value: 0x1, doc: "The device exists and can serve transfers." }
      - { symbol: BLOCK_DESCRIPTOR_FLAG_ACTIVE_SERVICE, value: 0x2, doc: "A filesystem service is mounted on it." }
      - { symbol: BLOCK_DESCRIPTOR_FLAG_READ_ONLY, value: 0x4, doc: "Writes are refused by the backend." }

  - name: volume_descriptor
    doc: |
      Version and size ceilings of wasmos_volume_descriptor_t, the record that
      describes one VOLUME -- a thing with a filesystem on it. The struct is
      declared in src/drivers/include/wasmos_driver_abi.h and mirrored in
      src/libc/zig/driver.zig; only the values a peer must agree on live here.

      A volume is not a block device and the two classes answer different
      questions. `block` answers "what storage exists"; a partition-table entry
      may hold no filesystem and a disk with no table may hold one, so mount
      policy that matches on `block` has to name disks and units. `volume`
      answers "what can be mounted", which is the question a rule actually asks.
      See docs/architecture/37-volume-manager.md.

      As with the block descriptor, a reader MUST reject a version it does not
      know rather than interpreting the fields it recognizes.
    constants:
      - { symbol: VOLUME_DESCRIPTOR_VERSION, value: 1, doc: "Current wasmos_volume_descriptor_t layout." }
      - symbol: VOLUME_DESCRIPTOR_LABEL_MAX
        value: 64
        doc: |
          Bytes reserved for the filesystem's own label, NUL included. FAT's is
          11 and WFS carries none, so this is set by what a future format might
          want rather than by what is read today -- ext4 allows 16 and NTFS 32
          UTF-16 units. Sized once here so adding a recogniser never forces a
          descriptor version bump.
      - symbol: VOLUME_DESCRIPTOR_UUID_MAX
        value: 16
        doc: |
          Bytes of volume UUID. The widest in use is WFS's 16; FAT's volume
          serial is 4 and occupies the low bytes with the rest zero, so a
          comparison always covers the full field and a short id can never alias
          a long one's prefix. `uuid_len` says how many the format defines, for
          rendering rather than for matching.
      - symbol: VOLUME_DESCRIPTOR_ID_MAX
        value: 64
        doc: |
          Bytes reserved for canonical_id, NUL included. A volume id is
          `volume:` prefixed to the canonical id of the block device beneath it
          (`volume:block:ata:0p1`), so it is DERIVED and stable across boots --
          and the `volume` class instance is an FNV-1a fingerprint of it, the
          same construction the `block` instance uses.

  - name: volume_descriptor_flags
    bits: true
    doc: |
      Bits of the `flags` field of wasmos_volume_descriptor_t.

      BOOT marks the volume this system was booted from. It is NOT the MBR
      active flag or the ESP type GUID: a table may mark any number of
      partitions bootable, on any disk, including one nothing booted from, and
      UEFI ignores the MBR flag entirely. Which volume was booted is a property
      of the BOOT, known only to the bootloader, and travels here from there.

      CLAIMED records that a filesystem service holds the volume. It RECORDS a
      claim and does not enforce one: the volume manager is not in the I/O path,
      so a tool that does not ask is not stopped. It is what `fsck` and `mkfs`
      consult before touching a volume that may be mounted.
    constants:
      - { symbol: VOLUME_DESCRIPTOR_FLAG_PRESENT, value: 0x1, doc: "The volume exists and can be mounted." }
      - { symbol: VOLUME_DESCRIPTOR_FLAG_HAS_LABEL, value: 0x2, doc: "The format carries a label; `label` is it, possibly empty." }
      - { symbol: VOLUME_DESCRIPTOR_FLAG_HAS_UUID, value: 0x4, doc: "The format carries a volume id; `uuid` is it." }
      - { symbol: VOLUME_DESCRIPTOR_FLAG_BOOT, value: 0x8, doc: "This system booted from this volume, as reported by the bootloader." }
      - { symbol: VOLUME_DESCRIPTOR_FLAG_CLAIMED, value: 0x10, doc: "A filesystem service has mounted it; advisory, not enforced." }
      - { symbol: VOLUME_DESCRIPTOR_FLAG_READ_ONLY, value: 0x20, doc: "The backing device refuses writes." }

  - name: svc_class_event
    doc: |
      Which existence event SVC_IPC_CLASS_EVENT reports, carried in its arg0.
      The rest of the message names the provider it happened to: arg1=instance,
      arg2=endpoint, arg3=pid.

      Existence only. A provider appearing, going away, or dying is the whole
      vocabulary; link state, media change and every other DOMAIN event travels
      over the provider's own protocol. That boundary is what keeps the registry
      a kernel primitive instead of a framework -- see
      docs/architecture/09-process-and-ipc.md.

      REMOVE covers a provider that unregistered and one the process manager
      reaped after its process died, deliberately: a subscriber must drop the
      endpoint either way, and a distinction it cannot act on differently would
      only invite it to handle one case and not the other.
    constants:
      - { symbol: SVC_CLASS_EVENT_ADD, value: 1, doc: "A provider registered under the class." }
      - { symbol: SVC_CLASS_EVENT_REMOVE, value: 2, doc: "A provider unregistered, or its process died and was reaped." }

  - name: net_socket_family
    doc: |
      Address family of a socket: which layer it addresses and therefore what an
      address means. Independent of the socket type below, as in BSD sockets.

      AF_PACKET is the link layer and its payload is a complete ethernet frame,
      destination MAC first. It is the only family that can carry a protocol
      below IP -- ARP being the reason it exists -- and it pairs only with RAW.
      The value matches Linux's AF_PACKET so the number is not a fresh invention
      a reader has to look up.
    constants:
      - { symbol: NET_SOCKET_AF_INET, value: 2, doc: IPv4. }
      - { symbol: NET_SOCKET_AF_INET6, value: 10, doc: IPv6. }
      - symbol: NET_SOCKET_AF_PACKET
        value: 17
        doc: Link layer; payload is a whole ethernet frame. RAW only.

  - name: net_socket_type
    doc: |
      Delivery discipline of a socket. STREAM and DGRAM run over a protocol above
      IP, so they require an AF_INET/AF_INET6 socket; RAW carries frames the
      caller frames itself and requires AF_PACKET. net-stack refuses any other
      pairing of the two axes.
    constants:
      - { symbol: NET_SOCKET_STREAM, value: 1, doc: Reliable byte stream (TCP). }
      - { symbol: NET_SOCKET_DGRAM, value: 2, doc: Datagrams (UDP). }
      - symbol: NET_SOCKET_RAW
        value: 3
        doc: Whole ethernet frames, header included. AF_PACKET only.

  - name: net_socket_open_flags
    bits: true
    doc: |
      net_socket_open_descriptor_v1_t.flags bits.
    constants:
      - symbol: NET_SOCKET_OPEN_FLAG_TLS
        value: 0x1
        doc: Stream socket is wrapped in TLS (altcp_tls).

  - name: net_socket_limits
    doc: |
      Sizes and versions both sides of a socket must agree on. They are ABI, not
      private choices: a client that sizes a buffer from a different number
      silently loses data the peer thinks it delivered.
    constants:
      - symbol: NET_SOCKET_OPEN_DESCRIPTOR_VERSION
        value: 1
        doc: Version of net_socket_open_descriptor_v1_t.
      - symbol: NET_SOCKET_SNI_MAX
        value: 256
        doc: |
          Capacity of the SNI / certificate-verification hostname in the open
          descriptor. A DNS name is at most 253 bytes; the extra room leaves
          space for the NUL mbedtls_ssl_set_hostname needs.
      - symbol: NET_PACKET_FRAME_MAX
        value: 2048
        doc: |
          Largest ethernet frame carried over a packet socket, in bytes.
          net-stack refuses a longer frame in either direction, and a client
          reading into anything smaller sees frames skipped. Generous next to
          the 1514-byte classic MTU so a jumbo-ish frame is not truncated.

  - name: net_udp_datagram
    doc: |
      Framing of one datagram record inside a UDP socket ring: this header,
      immediately followed by payload_bytes of payload.
    constants:
      - { symbol: NET_UDP_DATAGRAM_RECORD_VERSION, value: 1, doc: Record version. }
      - symbol: NET_UDP_DATAGRAM_FLAG_DESTINATION
        value: 0x1
        doc: Record carries explicit destination fields (an unconnected sendto).

  - name: net_ifaddr
    doc: |
      Interface address records, as reported by NET_IPC_IFADDR_LIST.
    constants:
      - { symbol: NET_IFADDR_RECORD_VERSION, value: 1, doc: Record version. }
      - symbol: NET_IFADDR_FLAG_LINK_UP
        value: 0x1
        doc: The link itself is up (carrier present).
      - symbol: NET_IFADDR_FLAG_ADMIN_UP
        value: 0x2
        doc: The interface is administratively enabled.
      - symbol: NET_IFADDR_FLAG_DHCP
        value: 0x4
        doc: Address is (or is being) assigned by DHCP.
