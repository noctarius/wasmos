# WASMOS error / status vocabulary — single source of truth.
#
# This file is the ONLY place error domains, domain ids, and codes are defined.
# `scripts/gen_abi_errors.py` generates `abi/generated/wasmos_status.h` (and,
# in later increments, the per-language constant tables) from it. Never edit the
# generated output; edit this file and regenerate.
#
# Model (see docs/architecture/34-abi-idl-and-error-model.md):
#   - `transport` is the global wasmos_status_t axis: did the call mechanism work.
#   - `domains` is the namespaced operation-error space. Each domain gets a STABLE
#     numeric id assigned here and nowhere else, so ids/codes can never collide or
#     drift across languages. A packed error code is (domain << 16) | local_code.
#   - Domain 0 (`none`) is reserved: success / empty chain frame.

abi_version: 1

# --- Transport / kernel-IPC result axis (wasmos_status_t) --------------------
# Global, small, negative-on-error. Returned when the call mechanism or the
# service itself fails (as opposed to a domain-level operation error).
transport:
  - { name: OK,          value: 0,  description: "success" }
  - { name: INVAL,       value: -1, description: "invalid argument" }
  - { name: DENIED,      value: -2, description: "capability or policy denied the operation" }
  - { name: FULL,        value: -3, description: "destination queue is full" }   # legacy IPC_ERR_FULL
  - { name: NOENT,       value: -4, description: "no such object or endpoint" }
  - { name: TIMEOUT,     value: -5, description: "operation timed out" }
  - { name: NOMEM,       value: -6, description: "out of memory" }
  - { name: UNSUPPORTED, value: -7, description: "operation not supported" }
  - { name: PEER_GONE,   value: -8, description: "peer process or endpoint no longer exists" }
  - { name: AGAIN,       value: -9, description: "retryable: resource temporarily unavailable" }

# --- Domain registry ---------------------------------------------------------
# Codes are seeded faithfully from the existing negative-int taxonomy in
# src/drivers/include/wasmos_driver_abi.h. Local code ids start at 1 per domain
# (0 within a domain is reserved). Migrating legacy call sites onto these packed
# (domain, code) constants is the next Phase-1 increment.
domains:
  none:
    id: 0
    description: "no domain — success / empty chain frame"
    codes: []

  proc_spawn:
    id: 1
    description: "process-manager path-spawn failures (was PROC_SPAWN_ERR_*)"
    codes:
      - { name: BAD_ENDPOINT,    description: "request endpoint owner lookup failed" }
      - { name: NO_CALLER,       description: "caller process/context not found" }
      - { name: BAD_PATH,        description: "fs endpoint missing or bad path length" }
      - { name: CALLER_FSBUF,    description: "caller xfer buffer missing / path too big" }
      - { name: ARGS_TOOBIG,     description: "args exceed the xfer buffer" }
      - { name: NO_PM_FSBUF,     description: "PM xfer buffer missing" }
      - { name: FS_READ,         description: "reading the app blob from FS failed" }
      - { name: SPAWN_FAILED,    description: "process create/start failed (e.g. no free slot)" }
      - { name: BROKER_IPC,      description: "broker plan IPC transport/reply failed" }
      - { name: BROKER_PLAN,     description: "broker replied with malformed/unsupported plan" }
      - { name: BROKER_DEFERRED, description: "valid broker plan returned; PM launch step deferred" }

  proc_pm:
    id: 2
    description: "non-path process-manager IPC failures (was PROC_PM_ERR_*)"
    codes:
      - { name: BUSY,            description: "PM already has an incompatible in-flight operation" }
      - { name: BAD_ENDPOINT,    description: "source endpoint owner lookup failed" }
      - { name: NO_CALLER,       description: "source endpoint owner has no live process" }
      - { name: INVALID_NAME,    description: "packed module/service name was empty or invalid" }
      - { name: INVALID_MODULE,  description: "requested module or descriptor was invalid" }
      - { name: FS_UNAVAILABLE,  description: "PM filesystem service channel was unavailable" }
      - { name: FS_REQUEST,      description: "PM could not issue the filesystem read request" }
      - { name: BAD_PATH,        description: "explicit path input was empty or invalid" }
      - { name: PATH_RESOLVE,    description: "path-based resolve/classify/reload failed" }
      - { name: SPAWN_FAILED,    description: "PM failed to create or prepare the child process" }
      - { name: CAPS_APPLY,      description: "capability profile application failed after spawn" }
      - { name: BAD_CAPS,        description: "capability payload or compact cap fields were invalid" }
      - { name: BAD_USER_PTR,    description: "supplied user pointer could not be resolved safely" }
      - { name: USER_COPY,       description: "mm_copy_from_user failed for PM input payload" }
      - { name: META_LOOKUP,     description: "module metadata lookup failed" }
      - { name: META_NOT_DRIVER, description: "requested module metadata was not for a driver" }
      - { name: META_BAD_INDEX,  description: "requested driver match index was out of range" }
      - { name: META_BAD_SOURCE, description: "unsupported module metadata source selector" }
      - { name: CALLER_FSBUF,    description: "caller filesystem transfer buffer was missing/invalid" }
      - { name: REPLY_SEND,      description: "PM failed to send the final IPC response" }
      - { name: FS_REPLY,        description: "PM received an unexpected filesystem reply" }
      - { name: BAD_BROKER,      description: "broker registration payload or endpoint was invalid" }
      - { name: BAD_HANDLER,     description: "exec-handler registration payload was invalid" }
      - { name: SUBSYSTEM_REG,   description: "subsystem broker registration failed" }
      - { name: HANDLER_REG,     description: "exec-handler registration failed" }
      - { name: NOT_AUTHORIZED,  description: "caller lacks the subsystem.register capability" }
      - { name: NO_PM_FSBUF,     description: "PM could not acquire its own xfer buffer" }

  shmem:
    id: 3
    description: "shared-memory map/map_auto failures (was SHMEM_ERR_*)"
    codes:
      - { name: BAD_ARGS,  description: "id/size invalid or size not page-aligned" }
      - { name: NO_CAP,    description: "caller lacks the DMA capability / no context" }
      - { name: BAD_ID,    description: "shmem id unknown / no backing pages" }
      - { name: BAD_SIZE,  description: "requested size smaller than the shared region" }
      - { name: UNALIGNED, description: "fixed offset cannot yield a page-aligned host addr" }
      - { name: NO_WINDOW, description: "no free page-aligned window fits in linear memory" }
      - { name: MAP,       description: "paging/linear-memory mapping step failed" }

  fs:
    id: 4
    description: "filesystem backend/VFS failures (was FS_ERR_*)"
    codes:
      - { name: BAD_ARGS,      description: "invalid flags/args (len 0, bad access mode, reserved arg set)" }
      - { name: PATH_TOO_LONG, description: "path length exceeds the path or xfer buffer" }
      - { name: BUFFER,        description: "xfer-buffer read/write/size call failed" }
      - { name: TRANSLATE,     description: "vfs path translation failed / routed to init overlay" }
      - { name: NOT_FOUND,     description: "path component or target entry does not exist" }
      - { name: IS_DIR,        description: "target is a directory where a file was required" }
      - { name: NOT_DIR,       description: "a path component that must be a directory is not one" }
      - { name: EXISTS,        description: "create target already exists (fail-if-exists)" }
      - { name: NOT_EMPTY,     description: "rmdir target directory is not empty" }
      - { name: NO_FD,         description: "open-file table is full" }
      - { name: BUSY,          description: "backend has no free op-context slot (retryable)" }
      - { name: IO,            description: "block-device I/O error" }
      - { name: NOT_READY,     description: "mount/backend not ready" }
      - { name: NO_SPACE,      description: "no free cluster or directory slot (disk full)" }
      - { name: NAME,          description: "invalid name (LFN/short-name encode failed)" }
      - { name: ACCESS,        description: "access-mode violation (e.g. read on write-only fd)" }
      - { name: RANGE,         description: "seek/offset out of range" }
      - { name: UNSUPPORTED,   description: "unknown/unsupported request type" }
      - { name: OPEN,          description: "operation forbidden on a currently-open file" }
      - { name: CORRUPT,       description: "on-disk structure inconsistency detected" }
      - { name: NOT_AUTHORIZED, description: "caller is not permitted to issue this request (e.g. clone-cwd is process-manager only)" }
      - { name: NO_CLIENT_SLOT, description: "per-client state could not be tracked (slot table full / allocation failed)" }
      - { name: NOT_ABSOLUTE,   description: "path must be absolute (does not start with '/')" }
      - { name: NO_BACKEND,     description: "no registered backend serves the requested mount" }
      - { name: REBORROW,       description: "reborrowing the client's xfer-buffer grant to the backend failed" }
      - { name: BACKEND_IPC,    description: "request could not be delivered to the backend, or no reply arrived" }
      - { name: BAD_FD,         description: "fd is not present in this client's fd table" }
      - { name: REPLY_SEND,     description: "the reply could not be delivered to the client" }

  net:
    id: 5
    description: "networking stack / socket failures (was NET_STATUS_*)"
    codes:
      - { name: WOULD_BLOCK,  description: "operation is deferred; completion arrives as a later event (retryable)" }
      - { name: INVALID,      description: "invalid request arguments (socket, address, or length)" }
      - { name: NOT_READY,    description: "interface or socket is not in a state that permits the operation" }
      - { name: DENIED,       description: "caller lacks the capability for this operation" }
      - { name: IO_ERROR,     description: "the underlying stack or driver reported a failure" }
      - { name: QUEUE_FULL,   description: "send/receive queue has no space (retryable)" }
      - { name: NO_MEM,       description: "no buffer or pcb could be allocated" }
      - { name: ADDR_IN_USE,  description: "the requested address or port is already bound" }
      - { name: TIMEOUT,      description: "the operation did not complete within its window" }

  gfx:
    id: 6
    description: "compositor / framebuffer text-console failures"
    codes:
      - { name: UNSUPPORTED_REQUEST, description: "unknown or unsupported request type for this framebuffer backend" }
      - { name: NO_RUNTIME_MODES,    description: "backend cannot enumerate or switch modes at runtime (firmware-provided framebuffer)" }
      - { name: BAD_MODE_INDEX,      description: "mode index is out of range for this backend" }
      - { name: MODE_TOO_LARGE,      description: "requested mode does not fit the framebuffer mapping established at boot" }
      - { name: MODE_SET_FAILED,     description: "requested geometry is not a supported mode, or the mode-set path is unavailable" }
      # Compositor request statuses (was GFX_STATUS_*).
      - { name: INVALID,             description: "invalid request arguments (window id, geometry, buffer, or opcode header)" }
      - { name: PERMISSION,          description: "caller is not permitted to act on the requested window or buffer" }
      - { name: UNSUPPORTED,         description: "unknown or unsupported compositor request" }
      - { name: BUSY,                description: "compositor has no free window/buffer slot (retryable)" }
      - { name: IO,                  description: "framebuffer or shared-buffer operation failed" }

  driver:
    id: 7
    description: "generic device-driver failures (reserved)"
    codes: []

  vt:
    id: 8
    description: "virtual-terminal multiplexer failures"
    codes:
      - { name: BAD_TTY_ID,          description: "requested tty id is out of range" }
      - { name: NO_TTY_FOR_SOURCE,   description: "no tty is associated with the requesting endpoint" }
      - { name: READER_BUSY,         description: "another endpoint is already the reader for this tty" }
      - { name: UNSUPPORTED_REQUEST, description: "unknown or unsupported request type" }
      # VT_IPC_SWITCH_TTY step failures (was VT_SWITCH_ERR_*).
      - { name: SWITCH_MODE_OFF,     description: "tty switch could not disable framebuffer rendering" }
      - { name: SWITCH_CLEAR,        description: "tty switch could not clear the screen" }
      - { name: SWITCH_REPLAY,       description: "tty switch could not replay the cell buffer" }
      - { name: SWITCH_MODE_ON,      description: "tty switch could not re-enable framebuffer rendering" }

  chardev:
    id: 9
    description: "character-device sample driver failures"
    codes:
      - { name: NO_DATA,             description: "no byte is buffered yet (retryable)" }
      - { name: UNSUPPORTED_REQUEST, description: "unknown or unsupported request type" }

  hrng:
    id: 14
    description: "hardware RNG provider failures (was HRNG_STATUS_*)"
    codes:
      - { name: INVALID,   description: "invalid request arguments (byte count or buffer)" }
      - { name: NOT_READY, description: "entropy source is not initialized or has no entropy yet" }
      - { name: IO_ERROR,  description: "the RNG device reported a failure" }
      - { name: TIMEOUT,   description: "the device did not produce entropy within its window" }
      - { name: PROTOCOL,  description: "the provider's reply did not match the request protocol" }

  dma:
    id: 15
    description: "DMA map/sync capability and range failures (was WASMOS_DMA_STATUS_*)"
    codes:
      - { name: DENY,        description: "the DMA capability or policy denied the operation" }
      - { name: INVALID,     description: "invalid DMA arguments (direction, handle, or length)" }
      - { name: RANGE,       description: "the requested subrange lies outside the mapped object" }
      - { name: UNAVAILABLE, description: "no DMA mapping slot or backing is available" }

  font:
    id: 12
    description: "font-rasterizer service failures (was FONT_STATUS_*)"
    codes:
      - { name: INVALID,     description: "invalid request arguments (font id, size, glyph, or buffer)" }
      - { name: PERMISSION,  description: "caller is not permitted to use the requested font resource" }
      - { name: UNSUPPORTED, description: "unknown or unsupported request type" }
      - { name: IO,          description: "reading or decoding the font file failed" }
      - { name: BUSY,        description: "no free rasterizer slot (retryable)" }

  rtc:
    id: 13
    description: "real-time-clock service failures (was RTC_STATUS_*)"
    codes:
      - { name: INVALID, description: "invalid request arguments" }
      - { name: IO,      description: "reading the CMOS/RTC registers failed" }
      - { name: TIMEOUT, description: "the RTC did not settle within the read window" }
      - { name: DENIED,  description: "caller lacks the capability for this operation" }

  xfer_buffer:
    id: 11
    description: "transfer-buffer object registry / borrow / DMA failures (was XFER_BUFFER_ERR_*)"
    codes:
      - { name: NULL_ARG,               description: "a required pointer argument was NULL" }
      - { name: INVALID_KIND,           description: "unknown or unsupported buffer kind" }
      - { name: INVALID_CONTEXT,        description: "a context id argument was zero" }
      - { name: INVALID_SIZE,           description: "a requested size was zero" }
      - { name: CAPACITY_EXCEEDED,      description: "requested size exceeds the kind's intrinsic capacity" }
      - { name: NO_BACKING,             description: "no physical backing could be obtained for the object" }
      - { name: INTERNAL,               description: "registry storage could not be initialized or grown" }
      - { name: NOT_FOUND,              description: "the referenced object does not exist (stale or destroyed)" }
      - { name: NOT_OWNER,              description: "the binding does not match the object's current owner" }
      - { name: INVALID_FLAGS,          description: "requested access flags are empty or contain invalid bits" }
      - { name: SELF_BORROW,            description: "a transfer object cannot be borrowed by its own owner" }
      - { name: ALREADY_BORROWED,       description: "the borrower already holds an active borrow on this object" }
      - { name: KIND_NOT_BORROWABLE,    description: "the kind may not be borrowed by the requested borrower" }
      - { name: KIND_NOT_TRANSFERABLE,  description: "the kind does not support ownership transfer" }
      - { name: ACTIVE_BORROWS,         description: "the object still has active borrows" }
      - { name: DMA_MAPPED,             description: "dMA is still mapped and blocks this operation" }
      - { name: SAME_OWNER,             description: "ownership transfer to the current owner is a no-op and rejected" }
      - { name: RIGHTS_AMPLIFICATION,   description: "downstream rights would exceed the upstream borrow's rights" }
      - { name: NOT_REBORROWABLE,       description: "the kind may not be reborrowed" }
      - { name: INACTIVE_BORROW,        description: "the referenced borrow is inactive, stale, or forged" }
      - { name: RANGE,                  description: "an offset/length subrange lies outside its bounds" }
      - { name: DIRECTION,              description: "the DMA direction is not permitted by the access rights" }
      - { name: DMA_ACTIVE,             description: "a DMA mapping is already active on this object or borrow" }
      - { name: INACTIVE_MAPPING,       description: "the DMA mapping is inactive" }
      - { name: NO_ACCESS,              description: "the object exists but the context is neither its owner nor a borrower" }

  devmgr:
    id: 10
    description: "device-manager query failures"
    codes:
      - { name: NO_MOUNT_RULE,     description: "no block/filesystem mount rule matches the requested unit" }
      - { name: UNSUPPORTED_QUERY, description: "unknown or unsupported device-manager query type" }
