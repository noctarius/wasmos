  - { name: random_get, id: 112, module: wasi_snapshot_preview1, runtimes: [warp], returns: status, params: [{name: buf, kind: out, len: len}, {name: len, kind: scalar}] }

  # --- late additions -------------------------------------------------------
  - { name: block_buffer_map, id: 113, returns: value }
  - { name: xfer_buffer_map, id: 114, returns: value, params: [{name: buffer_id, kind: handle}] }
  - { name: xfer_buffer_unmap, id: 115, returns: status, params: [{name: buffer_id, kind: handle}] }
  - { name: klog_register_ring, id: 116, returns: status, params: [{name: id, kind: handle}] }

