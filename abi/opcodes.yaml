# WASMOS IPC opcode ABI — single source of truth for the wasmos_driver_abi.h
# opcode (positive IPC message `type`) space. Generated C enums + the
# opcode->name diagnostic tables + doc opcode tables come from this file via
# scripts/gen_abi_opcodes.py. Negative *_ERR_* codes live in abi/errors.yaml;
# flags/descriptors stay hand-written in the header. See
# docs/architecture/34-abi-idl-and-error-model.md.
#
# `kind`: req | resp | error | notify (diagnostic/doc only). `doc` (optional):
# emitted as a comment into the generated enum + doc tables.

abi_version: 1

subsystems:
  - name: chardev
    id: 0
    range: [0x100, 0x1ff]
    opcodes:
      - { symbol: WASM_CHARDEV_IPC_READ_REQ, value: 0x100, kind: req }
      - { symbol: WASM_CHARDEV_IPC_WRITE_REQ, value: 0x101, kind: req }
      - { symbol: WASM_CHARDEV_IPC_READ_RESP, value: 0x180, kind: resp }
      - { symbol: WASM_CHARDEV_IPC_WRITE_RESP, value: 0x181, kind: resp }
      - { symbol: WASM_CHARDEV_IPC_ERROR_RESP, value: 0x1ff, kind: error }

  - name: proc_manager
    id: 1
    range: [0x200, 0x2ff]
    opcodes:
      - { symbol: PROC_IPC_SPAWN, value: 0x200, kind: req }
      - { symbol: PROC_IPC_WAIT, value: 0x201, kind: req }
      - { symbol: PROC_IPC_KILL, value: 0x202, kind: req }
      - { symbol: PROC_IPC_STATUS, value: 0x203, kind: req }
      - { symbol: PROC_IPC_SPAWN_NAME, value: 0x204, kind: req }
      - { symbol: PROC_IPC_SPAWN_CAPS, value: 0x205, kind: req }
      - symbol: PROC_IPC_MODULE_META_DESC
        value: 0x212
        kind: req
        doc: |
          What a boot module declares about itself, as a wasmos_module_meta_desc_t
          written into a transfer buffer the caller owns and has lent WRITE to
          process-manager: capability flags, declared register windows, and the
          storage-bootstrap flag.
          arg0=module_index arg2=buffer_id arg3=byte_offset.
          On success: PROC_IPC_RESP, arg0=bytes written.
          Which device a driver binds to is not asked here; that comes from the
          device-manager rules.
      - { symbol: PROC_IPC_MODULE_META_PATH, value: 0x207, kind: req }
      - symbol: PROC_IPC_SPAWN_CAPS_V2
        value: 0x208
        kind: req
        doc: |
          Spawn with extended capability descriptor payload:
          arg0=module_index arg1=user_ptr(wasmos_spawn_caps_v2_t + windows[])
          arg2=payload_size_bytes arg3=reserved(0).
      - symbol: PROC_IPC_SPAWN_PATH
        value: 0x209
        kind: req
        doc: |
          Spawn from explicit app path:
          caller must place path bytes at xfer buffer offset 0.
          optional raw command argument text is placed at offset (path_len + 1).
          arg0=reserved(0) arg1=((buffer_id<<12)|(path_len&0xFFF)) arg2=args_len
          arg3=reserved.
          On success (app kind): PROC_IPC_RESP, arg0=child_pid, arg1=app_flags.
          For service/driver kinds the PM delays the PROC_IPC_RESP until the child
          calls PROC_IPC_NOTIFY_READY (behaves like SPAWN_PATH_SYNC internally).
      - symbol: PROC_IPC_SPAWN_PATH_CAPS
        value: 0x20a
        kind: req
        doc: |
          Spawn from explicit app path with I/O-port + IRQ capabilities:
          caller must place path bytes at xfer buffer offset 0.
          arg0=((irq_mask<<16)|(cap_flags&0xFFFF)) arg1=path_len
          arg2=((io_port_max<<16)|io_port_min)     arg3=reserved.
      - symbol: PROC_IPC_SPAWN_SYNC
        value: 0x20b
        kind: req
        doc: |
          Spawn by module index and block until the child calls NOTIFY_READY (or
          first blocks on IPC as an implicit signal), or until the timeout expires.
          arg0=module_index  arg1=timeout_ms (0 = wait forever)
          arg2=reserved(0)   arg3=reserved(0).
          On success: PROC_IPC_RESP, arg0=child_pid.
          On timeout or child death before ready: PROC_IPC_ERROR, arg1=error_code.
      - symbol: PROC_IPC_NOTIFY_READY
        value: 0x20c
        kind: notify
        doc: |
          Service sends this to proc_endpoint when it has finished initialising and
          is ready to accept requests.  Fire-and-forget — no reply is sent back.
          arg0..arg3 = reserved(0).
      - symbol: PROC_IPC_SPAWN_CAPS_SYNC
        value: 0x20d
        kind: req
        doc: |
          Sync variants of SPAWN_CAPS / SPAWN_PATH / SPAWN_PATH_CAPS.
          Same cap/path encoding as their async counterparts, with one arg
          repurposed for timeout_ms:
          SPAWN_CAPS_SYNC:      arg0=module_index arg1=cap_flags arg2=io_packed
          arg3=(irq_mask&0xFFFF)|((timeout_ms&0xFFFF)<<16)
          SPAWN_PATH_SYNC:      path at FS buf[0], arg0=0 arg1=path_len
          arg2=0 arg3=timeout_ms
          SPAWN_PATH_CAPS_SYNC: path at FS buf[0],
          arg0=(irq<<16)|cap_flags arg1=path_len
          arg2=io_packed           arg3=timeout_ms
          On success: PROC_IPC_RESP, arg0=child_pid.
          On timeout or child death before ready: PROC_IPC_ERROR.
      - { symbol: PROC_IPC_SPAWN_PATH_SYNC, value: 0x20e, kind: req }
      - { symbol: PROC_IPC_SPAWN_PATH_CAPS_SYNC, value: 0x20f, kind: req }
      - symbol: PROC_IPC_SUBSYSTEM_REGISTER_BROKER
        value: 0x210
        kind: req
        doc: |
          Descriptor-based broker subsystem registration.
          arg0=offset(0) arg1=byte_len(sizeof(wasmos_subsystem_broker_register_desc_t))
          arg2=reserved(0) arg3=reserved(0).
      - symbol: PROC_IPC_EXEC_HANDLER_REGISTER
        value: 0x211
        kind: req
        doc: |
          Descriptor-based exec handler registration.
          arg0=offset(0) arg1=byte_len(sizeof(desc)+node_bytes)
          arg2=reserved(0) arg3=reserved(0).
      - { symbol: PROC_IPC_RESP, value: 0x280, kind: resp }
      - { symbol: PROC_IPC_ERROR, value: 0x2ff, kind: error }

  - name: proc_broker
    id: 2
    range: [0x223, 0x2e3]
    opcodes:
      - symbol: PROC_BROKER_IPC_SPAWN_PLAN_REQ
        value: 0x223
        kind: req
        doc: |
          Broker spawn-plan handoff:
          PM lends its xfer buffer to the broker read-only, writes a
          wasmos_broker_spawn_plan_request_t into that borrowed view, then sends
          this request with arg0=request_offset and arg1=request_size.
          The broker replies on msg->source with the same request_id. On success
          arg0=plan_offset and arg1=plan_size in the broker's own xfer buffer.
      - { symbol: PROC_BROKER_IPC_SPAWN_PLAN_RESP, value: 0x2a3, kind: resp }
      - { symbol: PROC_BROKER_IPC_SPAWN_PLAN_ERROR, value: 0x2e3, kind: error }

  - name: service_registry
    id: 3
    range: [0x220, 0x2af]
    opcodes:
      - symbol: SVC_IPC_REGISTER_REQ
        value: 0x220
        kind: req
        doc: |
          Legacy arg-packed register (reply lands on the service endpoint).
          TODO: migrate the remaining senders (AssemblyScript rtc/mouse/keyboard,
          native zig libsys) to SVC_IPC_REGISTER_DESC_REQ and remove this path.
      - { symbol: SVC_IPC_LOOKUP_REQ, value: 0x221, kind: req }
      - symbol: SVC_IPC_REGISTER_DESC_REQ
        value: 0x222
        kind: req
        doc: |
          Descriptor-based register: the request payload is a svc_register_desc_t
          placed by the caller at FS-buffer offset 0; arg0=offset(0), arg1=byte len.
          msg->source is a DEDICATED reply endpoint (not the service endpoint), so
          the SVC_IPC_REGISTER_RESP cannot collide with serve traffic on the service
          endpoint.  This replaces the arg-packed SVC_IPC_REGISTER_REQ, whose 16-byte
          name consumed all four args and forced the reply onto the serve endpoint
          (a latent races that deadlocked boot once PM stopped busy-polling).
      - symbol: SVC_IPC_LOOKUP_CLASS_REQ
        value: 0x223
        kind: req
        doc: |
          Class-based discovery (see docs/architecture/09-process-and-ipc.md).
          LOOKUP_CLASS: enumerate every provider registered under a virtual class.
          req  arg0=buffer_id (class name NUL-terminated at offset 0 on input;
          PM overwrites it with a svc_class_entry_t[] on output),
          arg1=max_entries the buffer can hold;
          resp SVC_IPC_LOOKUP_CLASS_RESP arg0=provider count (may exceed
          max_entries; only min(count,max_entries) entries are written).
          SUBSCRIBE_CLASS: receive existence events for a class.
          req  arg0=notify_endpoint (where SVC_IPC_CLASS_EVENT is delivered),
          arg1=buffer_id (class name NUL-terminated at offset 0);
          resp SVC_IPC_SUBSCRIBE_CLASS_RESP arg0=0.
          CLASS_EVENT is pushed to a subscriber's notify_endpoint on add/remove/die:
          arg0=SVC_CLASS_EVENT_* arg1=instance arg2=endpoint arg3=pid.
      - { symbol: SVC_IPC_SUBSCRIBE_CLASS_REQ, value: 0x224, kind: req }
      - { symbol: SVC_IPC_REGISTER_RESP, value: 0x2a0, kind: resp }
      - { symbol: SVC_IPC_LOOKUP_RESP, value: 0x2a1, kind: resp }
      - { symbol: SVC_IPC_LOOKUP_CLASS_RESP, value: 0x2a2, kind: resp }
      - { symbol: SVC_IPC_SUBSCRIBE_CLASS_RESP, value: 0x2a3, kind: resp }
      - { symbol: SVC_IPC_CLASS_EVENT, value: 0x2a4, kind: notify }
      - { symbol: SVC_IPC_ERROR, value: 0x2af, kind: error }

  - name: block
    id: 4
    range: [0x300, 0x3ff]
    opcodes:
      - symbol: BLOCK_IPC_READ_REQ
        value: 0x300
        kind: req
        doc: |
          Read sectors, described by a wasmos_block_request_t in a buffer the
          CALLER owns and has borrowed to this endpoint.
          arg0=buffer_id arg1=byte_offset arg2=size arg3=reserved(0).

          The request names its own target device, its 64-bit LBA, and where the
          data goes (see BLOCK_DST_* in abi/constants.yaml). None of that fits in
          four argument words, which is why they no longer carry it: the packed
          form forced a 32-bit LBA, inferred the target from the sender's
          endpoint, and needed a separate opcode for a transfer-buffer
          destination.

          A caller acquires and borrows ONE buffer per operation and reuses it
          for every request in that operation, writing a fresh request into its
          own slot; the buffer is not acquired per transfer.

          On success: BLOCK_IPC_READ_RESP, arg1 = sectors transferred, which may
          be fewer than asked. On failure: BLOCK_IPC_ERROR, arg0 = reason.
      - symbol: BLOCK_IPC_WRITE_REQ
        value: 0x301
        kind: req
        doc: |
          Write sectors, described by a wasmos_block_request_t exactly as
          BLOCK_IPC_READ_REQ describes a read: arg0=buffer_id arg1=byte_offset
          arg2=size arg3=reserved(0). The destination fields name the SOURCE of
          the data here; the direction is the opcode's.

          On success: BLOCK_IPC_WRITE_RESP, arg1 = sectors transferred.
          On failure: BLOCK_IPC_ERROR, arg0 = reason.
      - symbol: BLOCK_IPC_IDENTIFY_REQ
        value: 0x302
        kind: req
        doc: |
          Ask a backend to describe one of its devices into a buffer the CALLER
          owns. arg0 = the device's `block` CLASS INSTANCE, arg1 = buffer_id.
          Answered with BLOCK_IPC_IDENTIFY_RESP.

          The caller acquires the buffer, borrows it to this endpoint with WRITE,
          and releases it when done -- the ownership model of
          docs/architecture/12-dma-transfers.md, where the client holds the
          lifecycle and the server is a transient grantee. A backend lending its
          OWN buffer instead would have to keep it alive for every client that
          ever asked, track who already holds a grant, and never rewrite it while
          lent; none of which it can do correctly, because a borrow is held per
          context and nothing tells a server when a client is finished.

          The instance rather than a unit, because that is the only name a client
          has: it found the provider by looking up the class, several instances
          of which may share one endpoint (an ATA controller registers one per
          drive). The instance is an opaque fingerprint of a canonical id, so
          nothing can be decoded out of it -- but the backend computed those
          fingerprints itself and can match one back to its own device. arg0 = 0
          means "the only device you serve", which a single-disk backend may take
          as read.

          IDENTIFY does not claim the device: reading a disk's geometry is not
          exclusive use, and requiring a claim made a mounted disk unqueryable,
          which defeats discovering it by class in the first place.
      # 0x303 was BLOCK_IPC_READ_ZC_REQ, a second read protocol that existed only
      # because a transfer-buffer destination could not be expressed in the
      # argument words left over after the block-buffer form had taken them. It
      # is now BLOCK_DST_XFER_BUFFER, a destination kind inside
      # wasmos_block_request_t. The value stays reserved rather than reused: a
      # stale client sending it should fail as unsupported, not be misread as
      # some later opcode.
      - symbol: BLOCK_IPC_FLUSH_REQ
        value: 0x304
        kind: req
        doc: |
          Commit everything already written to durable media, so a caller that
          orders its writes can rely on that order surviving power loss.
          arg0..arg3 reserved (must be zero).
          Ordering a request after a reply only guarantees the DEVICE saw them in
          that order; a volatile write cache may still lose the earlier ones. A
          journal barrier (docs/WFS_WASMOS_FILE_SYSTEM.md section 14, steps 2, 4
          and 6) is exactly that guarantee and needs this.
          A device with no volatile write cache answers success without doing
          anything, because for it the guarantee already holds.
          On success: BLOCK_IPC_FLUSH_RESP. On failure: BLOCK_IPC_ERROR,
          arg0 = reason.
      - { symbol: BLOCK_IPC_READ_RESP, value: 0x380, kind: resp }
      - { symbol: BLOCK_IPC_WRITE_RESP, value: 0x381, kind: resp }
      - symbol: BLOCK_IPC_IDENTIFY_RESP
        value: 0x382
        kind: resp
        doc: |
          The answer to BLOCK_IPC_IDENTIFY_REQ: a wasmos_block_descriptor_t
          written into the caller's own buffer at offset 0. arg0=0 on success,
          arg1=bytes written. The caller already knows the buffer_id -- it
          acquired it -- so the reply names only how much is there.

          The descriptor is written FRESH on every call, so it is the device's
          state at reply time rather than a snapshot the backend published
          earlier and may since have outgrown.

          Geometry that used to travel in the arguments -- sector count, unit --
          is in the descriptor, together with everything a caller now matches on:
          canonical_id, scheme, fs_type, the GPT identity fields, and the LBA
          window. Callers read fields; they do not decode packed words.
      - { symbol: BLOCK_IPC_FLUSH_RESP, value: 0x383, kind: resp }
      - { symbol: BLOCK_IPC_ERROR, value: 0x3ff, kind: error }

  - name: fs
    id: 5
    range: [0x400, 0x4ff]
    opcodes:
      - { symbol: FS_IPC_OPEN_REQ, value: 0x400, kind: req }
      - { symbol: FS_IPC_READ_REQ, value: 0x401, kind: req }
      - { symbol: FS_IPC_CLOSE_REQ, value: 0x402, kind: req }
      - { symbol: FS_IPC_STAT_REQ, value: 0x403, kind: req }
      - { symbol: FS_IPC_READY_REQ, value: 0x404, kind: req }
      - { symbol: FS_IPC_SEEK_REQ, value: 0x405, kind: req }
      - { symbol: FS_IPC_WRITE_REQ, value: 0x406, kind: req }
      - { symbol: FS_IPC_UNLINK_REQ, value: 0x407, kind: req }
      - { symbol: FS_IPC_MKDIR_REQ, value: 0x408, kind: req }
      - { symbol: FS_IPC_RMDIR_REQ, value: 0x409, kind: req }
      - { symbol: FS_IPC_READDIR_REQ, value: 0x410, kind: req }
      - { symbol: FS_IPC_CHDIR_REQ, value: 0x412, kind: req }
      - { symbol: FS_IPC_READ_APP_REQ, value: 0x413, kind: req }
      - { symbol: FS_IPC_READ_PATH_REQ, value: 0x414, kind: req }
      - { symbol: FS_IPC_RENAME_REQ, value: 0x415, kind: req }
      - { symbol: FS_IPC_RESP, value: 0x480, kind: resp }
      - { symbol: FS_IPC_STREAM, value: 0x481, kind: resp }
      - { symbol: FS_IPC_ERROR, value: 0x4ff, kind: error }

  - name: fs_manager
    id: 6
    range: [0x420, 0x4a2]
    opcodes:
      - symbol: FSMGR_IPC_BACKEND_INFO_REQ
        value: 0x420
        kind: req
        doc: |
          fs-manager -> backend pull: report kind/fs-type/mount/unit. Reply RESP
          packs arg0=kind, arg1=fs_type, arg2=(mount_buffer_id<<12)|mount_len
          (backend owns the buffer and borrows it READ to fs-manager), arg3=unit.
          Backends are discovered via svc class FSMGR_BACKEND_CLASS, not a push,
          so fs-manager rebuilds its backend set from the registry on (re)start.

          arg0 `kind` is FSMGR_BACKEND_BLOCK or FSMGR_BACKEND_INIT: it separates a
          block-backed backend from the initfs one and carries NO filesystem
          identity, so every block-backed backend reports the same value whatever
          it mounts. arg1 `fs_type` is the FS_TYPE_* the backend serves and is the
          only field that answers "which filesystem". A backend that sits on no
          block device names itself too -- initfs reports FS_TYPE_INITFS -- so a
          pseudo-filesystem is a value in that enum rather than a special case
          wherever a mount is named; FS_TYPE_UNKNOWN means the backend named
          nothing. Deriving a filesystem from `kind` reports every mounted volume
          as FAT.
      - { symbol: FSMGR_IPC_CLONE_CWD_REQ, value: 0x421, kind: req }
      - { symbol: FSMGR_IPC_QUERY_MOUNTS_REQ, value: 0x422, kind: req }
      - { symbol: FSMGR_IPC_BACKEND_INFO_RESP, value: 0x4a0, kind: resp }
      - { symbol: FSMGR_IPC_CLONE_CWD_RESP, value: 0x4a1, kind: resp }
      - { symbol: FSMGR_IPC_QUERY_MOUNTS_RESP, value: 0x4a2, kind: resp }

  - name: fbtext
    id: 7
    range: [0x600, 0x6ff]
    opcodes:
      - { symbol: FBTEXT_IPC_CELL_WRITE_REQ, value: 0x600, kind: req }
      - { symbol: FBTEXT_IPC_CURSOR_SET_REQ, value: 0x601, kind: req }
      - { symbol: FBTEXT_IPC_SCROLL_REQ, value: 0x602, kind: req }
      - { symbol: FBTEXT_IPC_CLEAR_REQ, value: 0x603, kind: req }
      - symbol: FBTEXT_IPC_CONSOLE_MODE_REQ
        value: 0x604
        kind: req
        doc: |
          Retired.  The framebuffer drivers no longer drain the kernel console
          ring -- they are pure blit surfaces and the vt paints the log from its
          own klog ring -- so there is no console mode to toggle and nothing
          sends this.  The value stays reserved rather than being reused.
      - symbol: FBTEXT_IPC_GEOMETRY_REQ
        value: 0x605
        kind: req
        doc: |
          resp: arg0=cols arg1=rows
      - symbol: FBTEXT_IPC_GFX_OVERLAY_REQ
        value: 0x606
        kind: req
        doc: |
          arg0: 0=unlock, 1=lock
      - symbol: FBTEXT_IPC_QUERY_CAPS_REQ
        value: 0x607
        kind: req
        doc: |
          resp: arg0=FBTEXT_CAP_* bitmask
      - symbol: FBTEXT_IPC_QUERY_MODES_REQ
        value: 0x608
        kind: req
        doc: |
          req: arg0=index, resp: arg0=w arg1=h arg2=stride
      - symbol: FBTEXT_IPC_SET_RESOLUTION_REQ
        value: 0x609
        kind: req
        doc: |
          req: arg0=w arg1=h
      - symbol: FBTEXT_IPC_BLIT_ATTACH_REQ
        value: 0x60a
        kind: req
        doc: |
          Bulk grid blit: instead of one CELL_WRITE per cell (a per-cell IPC loop
          that storms the driver's queue and wedges tty switching under SMP), the VT
          shares a cell-grid xfer-buffer and repaints the whole visible grid with a
          single IPC. ATTACH (once) hands the driver a borrowed grid buffer to map;
          BLIT_GRID (per repaint) tells it to render cols*rows fbtext_blit_cell_t
          entries from that buffer.
      - symbol: FBTEXT_IPC_BLIT_GRID_REQ
        value: 0x60b
        kind: req
        doc: |
          arg0=cols arg1=rows (from the attached buffer)
      - { symbol: FBTEXT_IPC_RESP, value: 0x680, kind: resp }
      - { symbol: FBTEXT_IPC_ERROR, value: 0x6ff, kind: error }

  - name: vt
    id: 8
    range: [0x700, 0x7ff]
    opcodes:
      - symbol: VT_IPC_WRITE_REQ
        value: 0x700
        kind: req
        doc: |
          arg0[27:24]=byte_count(1-4), arg0[7:0]..arg3[7:0]=bytes
      - { symbol: VT_IPC_READ_REQ, value: 0x701, kind: req }
      - { symbol: VT_IPC_SET_ATTR_REQ, value: 0x702, kind: req }
      - { symbol: VT_IPC_SWITCH_TTY, value: 0x703, kind: req }
      - { symbol: VT_IPC_GET_ACTIVE_TTY, value: 0x704, kind: req }
      - { symbol: VT_IPC_REGISTER_WRITER, value: 0x705, kind: req }
      - { symbol: VT_IPC_SET_MODE_REQ, value: 0x706, kind: req }
      - symbol: VT_IPC_SERIAL_INPUT_REQ
        value: 0x707
        kind: req
        doc: |
          serial driver -> vt: RX bytes for the serial-bound slot, packed like
          VT_IPC_WRITE_REQ (arg0[27:24]=byte_count, arg0[7:0]..arg3[7:0]=bytes).
      - symbol: VT_IPC_BIND_SERIAL_REQ
        value: 0x708
        kind: req
        doc: |
          Bind the serial console to a slot: arg0=slot.  Serial RX is injected
          into that slot's line discipline from then on, whichever slot is
          visible, and it is independent of VT_IPC_SWITCH_TTY.  Slot 0 is the GUI
          slot and is refused (WASMOS_ERR_VT_SERIAL_SLOT_GUI); an out-of-range
          slot answers WASMOS_ERR_VT_BAD_TTY_ID.  RESP arg0=the bound slot.
      - { symbol: VT_IPC_RESP, value: 0x780, kind: resp }
      - symbol: VT_IPC_INPUT_NOTIFY
        value: 0x781
        kind: notify
        doc: |
          vt -> a slot's registered reader: input is available on your slot; drain
          it with VT_IPC_READ_REQ.  Fire-and-forget (request_id 0), arg0=slot.
      - symbol: VT_IPC_KEY_FORWARD
        value: 0x782
        kind: notify
        doc: |
          vt -> compositor (the vt-0 key sink): a decoded key event for the focused
          window.  Fire-and-forget.  arg0=ascii/keysym (0 if none), arg1=scancode,
          arg2=flags (bit0=down, bit1=extended, bit2=shift, bit3=ctrl, bit4=altgr).
      - symbol: VT_IPC_VIS_NOTIFY
        value: 0x783
        kind: notify
        doc: |
          vt -> compositor (the vt-0 key sink): the visible slot changed.  The
          compositor owns the framebuffer only while vt-0 is visible; on this notify
          it resumes/relinquishes drawing.  Fire-and-forget.  arg0=1 if vt-0 is now
          the visible slot, 0 otherwise.
      - symbol: VT_IPC_KLOG_NOTIFY
        value: 0x784
        kind: notify
        doc: |
          kernel -> vt: klog bytes are pending in the ring registered through
          wasmos_klog_register_ring.  Fire-and-forget, carries no payload: the vt
          drains the ring on every wake, so receiving it is the whole point and the
          message itself needs no handling beyond not being treated as an error.
          Without this doorbell an idle vt drains only on the next unrelated
          message, which strands klog on screen while the system is quiet.
      - { symbol: VT_IPC_ERROR, value: 0x7ff, kind: error }

  - name: serial
    id: 9
    range: [0x500, 0x5FF]
    opcodes:
      - { symbol: SERIAL_DRIVER_WRITE_REQ, value: 0x500, kind: req }
      - { symbol: SERIAL_DRIVER_READ_REQ, value: 0x501, kind: req }
      - { symbol: SERIAL_DRIVER_RESP, value: 0x580, kind: resp }
      - { symbol: SERIAL_DRIVER_ERROR, value: 0x5FF, kind: error }
      - { symbol: SERIAL_IPC_SUBSCRIBE_REQ, value: 0x502, kind: req }
      - { symbol: SERIAL_IPC_SUBSCRIBE_RESP, value: 0x582, kind: resp }

  - name: keyboard
    id: 10
    range: [0x800, 0x880]
    opcodes:
      - { symbol: KBD_IPC_SUBSCRIBE_REQ, value: 0x800, kind: req }
      - { symbol: KBD_IPC_SUBSCRIBE_RESP, value: 0x880, kind: resp }
      - { symbol: KBD_IPC_KEY_NOTIFY, value: 0x801, kind: notify }

  - name: mouse
    id: 11
    range: [0x810, 0x890]
    opcodes:
      - { symbol: MOUSE_IPC_SUBSCRIBE_REQ, value: 0x810, kind: req }
      - { symbol: MOUSE_IPC_SUBSCRIBE_RESP, value: 0x890, kind: resp }
      - symbol: MOUSE_IPC_MOVE_NOTIFY
        value: 0x811
        kind: notify
        doc: |
          arg0=dx (signed 8-bit in low byte), arg1=dy (signed 8-bit in low byte),
          arg2=buttons (bit0=left bit1=right bit2=middle), arg3=flags reserved.

  - name: rtc
    id: 12
    range: [0x820, 0x8ff]
    opcodes:
      # `rpc:` opts a request opcode into a generated typed future stub (Phase 3c
      # proof-of-concept). request/reply_args name the arg0..argN words in order;
      # bit-level packing stays hand-written (rtc_ipc_pack_time_*).
      - symbol: RTC_IPC_READ_REQ
        value: 0x820
        kind: req
        rpc:
          reply: RTC_IPC_READ_RESP
          error: RTC_IPC_ERROR
          request: []
          reply_args: [time_packed_lo, time_packed_hi]
      - symbol: RTC_IPC_SET_REQ
        value: 0x821
        kind: req
        rpc:
          reply: RTC_IPC_SET_RESP
          error: RTC_IPC_ERROR
          request: [time_packed_lo, time_packed_hi]
          reply_args: [status]
      - { symbol: RTC_IPC_READ_RESP, value: 0x8a0, kind: resp }
      - { symbol: RTC_IPC_SET_RESP, value: 0x8a1, kind: resp }
      - { symbol: RTC_IPC_ERROR, value: 0x8ff, kind: error }

  - name: virtio_serial
    id: 13
    range: [0x830, 0x8bf]
    opcodes:
      - { symbol: VIRTIO_SERIAL_IPC_QUERY_REQ, value: 0x830, kind: req }
      - { symbol: VIRTIO_SERIAL_IPC_READ_REG32_REQ, value: 0x831, kind: req }
      - { symbol: VIRTIO_SERIAL_IPC_WRITE_REG32_REQ, value: 0x832, kind: req }
      - { symbol: VIRTIO_SERIAL_IPC_RESP, value: 0x8b0, kind: resp }
      - { symbol: VIRTIO_SERIAL_IPC_ERROR, value: 0x8bf, kind: error }

  - name: device_manager
    id: 14
    range: [0x900, 0x982]
    opcodes:
      - { symbol: DEVMGR_PUBLISH_DEVICE, value: 0x900, kind: req }
      - { symbol: DEVMGR_PCI_SCAN_DONE, value: 0x901, kind: resp }
      - { symbol: DEVMGR_QUERY_MOUNT_REQ, value: 0x902, kind: req }
      - symbol: DEVMGR_PUBLISH_BLOCK_DEVICE
        value: 0x903
        kind: req
        doc: |
          Announce one block device to the device-manager inventory as a
          wasmos_block_descriptor_t held in a transfer buffer the publisher has
          borrowed to this endpoint.
          arg0=buffer_id arg1=byte_offset arg2=descriptor_size arg3=reserved(0).

          Each device occupies its own offset, so the publisher never overwrites
          a descriptor the receiver has not read yet and no acknowledgement is
          needed -- the same discipline DEVMGR_PUBLISH_DEVICE_DESC uses.

          The descriptor's canonical_id is the device's IDENTITY and the
          inventory keys on it. backend and unit are attributes of the device
          rather than its name: the unit is BACKEND-LOCAL, since ATA numbers its
          drives 0 and 1 while a virtio-blk device numbers itself by bus
          position. Publishing without a backend leaves the record
          BLOCK_BACKEND_UNKNOWN, which no `DRIVER==` rule matches.

          A descriptor whose version is not BLOCK_DESCRIPTOR_VERSION is dropped
          rather than partially read; see WASMOS_ERR_BLOCK_DEV_DESCRIPTOR_VERSION.
      # 0x904 reserved: DEVMGR_QUERY_BLOCK_MOUNT_REQ, retired. It answered
      # "where does the disk at this unit mount?", which cannot be asked --
      # every partition of a disk reports that disk's unit, so the question
      # names a device and the answer names a volume. The mount point now
      # travels in the filesystem driver's startup arguments as `mount=`,
      # chosen by the rule that spawned it.
      - symbol: DEVMGR_ACPI_SCAN_DONE
        value: 0x905
        kind: resp
        doc: |
          ISA/ACPI devices: bus=0xFF in PUBLISH_DEVICE marks a non-PCI device;
          device_id field carries the I/O base address for serial (class 0x07).
      - symbol: DEVMGR_PUBLISH_DEVICE_DESC
        value: 0x906
        kind: req
        doc: |
          Publish one enumerated PCI function as a wasmos_pci_device_desc_t held
          in a transfer buffer the publisher has borrowed to this endpoint.
          arg0=buffer_id arg1=byte_offset arg2=descriptor_size arg3=reserved(0).
          Each device occupies its own offset, so the publisher never overwrites
          a descriptor the receiver has not read yet and no acknowledgement is
          needed. Supersedes DEVMGR_PUBLISH_DEVICE, whose four argument words
          cannot describe six BARs and the capability offsets.
      - symbol: DEVMGR_PUBLISH_VOLUME
        value: 0x907
        kind: req
        doc: |
          Announce one VOLUME to the device-manager inventory as a
          wasmos_volume_descriptor_t held in a transfer buffer the publisher has
          borrowed to this endpoint.
          arg0=buffer_id arg1=byte_offset arg2=descriptor_size arg3=reserved(0).

          Same discipline as DEVMGR_PUBLISH_BLOCK_DEVICE: one offset per volume,
          so a publisher never overwrites a descriptor the receiver has not read
          yet, and no acknowledgement is owed.

          A volume is what can be MOUNTED, which the `block` inventory cannot
          say: a partition-table entry may hold no filesystem and a disk with no
          table may hold one. The two inventories are therefore separate rather
          than one with a flag -- a rule matching SUBSYSTEM=="volume" is asking a
          different question from one matching SUBSYSTEM=="block".

          The descriptor names its backing device by CLASS INSTANCE, not by id.
          A consumer that needs the id resolves it through the block inventory,
          which is where the publisher of that id already put it; carrying a
          second copy here would be a second place that can disagree.

          A descriptor whose version is not VOLUME_DESCRIPTOR_VERSION is dropped
          rather than partially read.
      - { symbol: DEVMGR_MOUNT_INFO, value: 0x980, kind: resp }
      # 0x982 reserved: DEVMGR_BLOCK_MOUNT_INFO, retired with its request above.
      - { symbol: DEVMGR_QUERY_DONE, value: 0x981, kind: resp }

  - name: netdrv
    id: 15
    range: [0xa00, 0xaff]
    opcodes:
      - { symbol: NETDRV_IPC_LINK_GET, value: 0xa00, kind: req }
      - { symbol: NETDRV_IPC_TX_FRAME, value: 0xa01, kind: req }
      - { symbol: NETDRV_IPC_RX_POLL, value: 0xa02, kind: req }
      - { symbol: NETDRV_IPC_STATS_GET, value: 0xa03, kind: req }
      - { symbol: NETDRV_IPC_RX_FRAME_NOTIFY, value: 0xa04, kind: notify }
      - symbol: NETDRV_IPC_LINK_NOTIFY
        value: 0xa05
        kind: notify
        doc: |
          Pushed to the interface subscriber when carrier changes. arg0=link_up,
          arg1=driver status word, arg2=MTU. LINK_GET also establishes/refreshes
          the subscriber, so old clients need no separate subscribe request.
      - { symbol: NETDRV_IPC_RESP, value: 0xa80, kind: resp }
      - { symbol: NETDRV_IPC_ERROR, value: 0xaff, kind: error }

  - name: hrng
    id: 16
    range: [0xc00, 0xcff]
    opcodes:
      - symbol: HRNG_IPC_GET_BYTES_REQ
        value: 0xc00
        kind: req
        doc: |
          arg0=buffer_id, arg1=len (bytes requested)
      - symbol: HRNG_IPC_RESP
        value: 0xc80
        kind: resp
        doc: |
          arg0=bytes written into the buffer
      - symbol: HRNG_IPC_ERROR
        value: 0xcff
        kind: error
        doc: |
          arg0=WASMOS_ERR_HRNG_*

  - name: net
    id: 17
    range: [0xb00, 0xbff]
    opcodes:
      - { symbol: NET_IPC_SOCKET_OPEN, value: 0xb00, kind: req }
      - { symbol: NET_IPC_BIND, value: 0xb01, kind: req }
      - { symbol: NET_IPC_CONNECT, value: 0xb02, kind: req }
      - { symbol: NET_IPC_SEND, value: 0xb03, kind: req }
      - { symbol: NET_IPC_RECV, value: 0xb04, kind: req }
      - { symbol: NET_IPC_CLOSE, value: 0xb05, kind: req }
      - { symbol: NET_IPC_POLL, value: 0xb06, kind: req }
      - { symbol: NET_IPC_IFADDR_ADD, value: 0xb07, kind: req }
      - { symbol: NET_IPC_IFADDR_DEL, value: 0xb08, kind: req }
      - { symbol: NET_IPC_IFADDR_LIST, value: 0xb09, kind: req }
      - symbol: NET_IPC_IF_HWADDR
        value: 0xb17
        kind: req
        doc: |
          The link-layer address of the interface a packet socket transmits on.
          arg0=interface index (0 selects the first interface that is up).
          On success: NET_IPC_RESP, arg0 = the low four address bytes, arg1 = the
          high two, both in wire order with byte 0 in the low byte.
          A packet socket needs this because the client owns the ethernet header
          and must put a real source address in it, or a reply is addressed to a
          machine that does not exist.
      - { symbol: NET_IPC_STACK_CREATE, value: 0xb0a, kind: req }
      - { symbol: NET_IPC_STACK_DESTROY, value: 0xb0b, kind: req }
      - { symbol: NET_IPC_STACK_SELECT, value: 0xb0c, kind: req }
      - { symbol: NET_IPC_DATA_NOTIFY, value: 0xb0d, kind: notify }
      - { symbol: NET_IPC_TX_NOTIFY, value: 0xb0e, kind: notify }
      - { symbol: NET_IPC_RX_NOTIFY, value: 0xb0f, kind: notify }
      - symbol: NET_IPC_IF_SET_STATE
        value: 0xb10
        kind: req
        doc: |
          Administrative interface up/down: arg0 = if_index, arg1 = 1 up / 0 down.
      - symbol: NET_IPC_DHCP_SET
        value: 0xb11
        kind: req
        doc: |
          DHCP client on/off: arg0 = if_index, arg1 = 1 start / 0 stop. Starting
          clears any static address so the client can bind a fresh lease; stopping
          leaves the current address in place.
      - symbol: NET_IPC_LISTEN
        value: 0xb12
        kind: req
        doc: |
          Passive-open a bound stream socket: arg0 = socket_id. Reply is immediate.
      - symbol: NET_IPC_ACCEPT
        value: 0xb13
        kind: req
        doc: |
          Post rings for the next inbound connection on a listening socket:
          arg0 = listening socket_id, arg1 = descriptor buffer_id,
          arg2 = descriptor borrow_id, arg3 = descriptor bytes. The descriptor
          (net_socket_open_descriptor_v1_t) carries the accepted socket's TX/RX ring
          grants. The reply is deferred until a connection is paired, and its
          arg0 (NET_IPC_RESP) is the accepted socket_id. Each posted ACCEPT is one
          accept slot; post several to accept several connections.
      - symbol: NET_IPC_RESOLVE
        value: 0xb14
        kind: req
        doc: |
          Resolve a hostname to an IPv4 address. The name is carried in a borrowed
          xfer buffer: arg0 = buffer_id, arg1 = borrow_id, arg2 = name length. The
          reply is deferred until the lwIP DNS callback fires. On RESP, arg0 is the
          status and arg1 is the resolved IPv4 (network-order word); failure comes
          back as NET_IPC_ERROR.
      - symbol: NET_IPC_DNS_SET
        value: 0xb15
        kind: req
        doc: |
          Replace the resolver list: arg0 = count (0..2), arg1/arg2 = server IPv4
          (network-order words). count=0 clears all servers. Reply is immediate.
      - symbol: NET_IPC_DNS_LIST
        value: 0xb16
        kind: req
        doc: |
          List configured resolvers. On RESP, arg0 is the status, arg1 = count and
          arg2/arg3 = the first two server IPv4 addresses (network-order words).
          Reply is immediate.
      - { symbol: NET_IPC_RESP, value: 0xb80, kind: resp }
      - { symbol: NET_IPC_ERROR, value: 0xbff, kind: error }

  - name: proc_dma
    id: 18
    range: [0x230, 0x2bf]
    opcodes:
      - { symbol: PROC_IPC_DMA_MAP_BORROW_REQ, value: 0x230, kind: req }
      - { symbol: PROC_IPC_DMA_SYNC_BORROW_REQ, value: 0x231, kind: req }
      - { symbol: PROC_IPC_DMA_UNMAP_BORROW_REQ, value: 0x232, kind: req }
      - { symbol: PROC_IPC_DMA_BORROW_RESP, value: 0x2b0, kind: resp }
      - { symbol: PROC_IPC_DMA_BORROW_ERROR, value: 0x2bf, kind: error }

  - name: font
    id: 19
    range: [0xA00, 0xAFF]
    opcodes:
      - { symbol: FONT_IPC_OPEN_FONT_REQ, value: 0xA00, kind: req }
      - { symbol: FONT_IPC_GET_METRICS_REQ, value: 0xA01, kind: req }
      - { symbol: FONT_IPC_MEASURE_GLYPH_REQ, value: 0xA03, kind: req }
      - { symbol: FONT_IPC_RASTER_GLYPH_INTO_REQ, value: 0xA04, kind: req }
      - { symbol: FONT_IPC_RESP, value: 0xA80, kind: resp }
      - { symbol: FONT_IPC_ERROR, value: 0xAFF, kind: error }

  - name: gfx
    id: 20
    range: [0x200, 0x2FF]
    opcodes:
      - { symbol: GFX_IPC_CREATE_WINDOW, value: 0x200, kind: req }
      - { symbol: GFX_IPC_DESTROY_WINDOW, value: 0x201, kind: req }
      - { symbol: GFX_IPC_RESIZE_WINDOW, value: 0x202, kind: req }
      - { symbol: GFX_IPC_SUBMIT_COMMANDS, value: 0x204, kind: req }
      - { symbol: GFX_IPC_PRESENT_WINDOW, value: 0x205, kind: req }
      - { symbol: GFX_IPC_PUSH_EVENT, value: 0x206, kind: notify }
      - { symbol: GFX_IPC_SET_DISPLAY_MODE, value: 0x208, kind: req }
      - { symbol: GFX_IPC_LIST_WINDOWS, value: 0x209, kind: req }
      - { symbol: GFX_IPC_FOCUS_WINDOW, value: 0x20A, kind: req }
      - { symbol: GFX_IPC_SET_WINDOW_FLAGS, value: 0x20B, kind: req }
      - { symbol: GFX_IPC_GET_DISPLAY_INFO, value: 0x20C, kind: req }
      - { symbol: GFX_IPC_MOVE_WINDOW, value: 0x20D, kind: req }
      - { symbol: GFX_IPC_SET_WINDOW_TITLE, value: 0x20E, kind: req }
      - { symbol: GFX_IPC_GET_WINDOW_TITLE, value: 0x20F, kind: req }
      - symbol: GFX_IPC_GET_SURFACE_SPEC
        value: 0x210
        kind: req
        doc: |
          Reply the CONSTRAINTS a surface must satisfy for `window_id`; allocates
          nothing. arg0 = window_id, arg1..arg3 reserved (0). The reply carries
          arg1 = stride in bytes, arg2 = required byte size, arg3 = (width << 16)
          | height, all for the window's current content extent.

          The client then acquires a transfer buffer of at least that size,
          borrows it to the compositor, and names it with GFX_IPC_ATTACH_SURFACE.
          A resize bumps the window generation, so the spec must be re-read and a
          new surface attached rather than the attached one resized in place --
          a borrowed buffer is never mutated (docs/architecture/12-dma-transfers.md).

          This replaced a compositor-side allocation that granted the buffer to
          the caller: a server cannot own a buffer it hands to a client.
      - symbol: GFX_IPC_ATTACH_SURFACE
        value: 0x211
        kind: req
        doc: |
          Register a surface the CLIENT owns and has borrowed to the compositor.
          arg0 = window_id, arg1 = buffer_id, arg2 = borrow_id, arg3 reserved (0).

          Three ids are a fixed, non-growing set, so they travel as bare argument
          words rather than a descriptor (skills/wasmos-add-opcode, Step 0).
          Both ids are required and neither is derivable compositor-side:
          xfer_buffer_borrow returns borrow_id to the OWNER, and the two are not
          interchangeable -- xfer_buffer_read/write key on buffer_id, while the
          borrow-side mapping path keys on borrow_id.

          Attach registers a surface; GFX_IPC_PRESENT_WINDOW names which attached
          surface is ready. Keeping them separate is what lets a client hold two
          surfaces at once, which both resize and tear-free presentation need.
      - symbol: GFX_IPC_DETACH_SURFACE
        value: 0x212
        kind: req
        doc: |
          Withdraw a surface previously attached with GFX_IPC_ATTACH_SURFACE.
          arg0 = window_id, arg1 = buffer_id, arg2..arg3 reserved (0).

          The client MUST detach before releasing the buffer. There is no
          unborrow notification, so a release while the compositor still holds
          the borrow leaves it reading a revoked borrow mid-composite; the
          acknowledged detach is that missing handshake. This replaced a call
          that asked the compositor to free a buffer the compositor owned.
      - { symbol: GFX_IPC_RESP, value: 0x280, kind: resp }
      - { symbol: GFX_IPC_ERROR, value: 0x2FF, kind: error }

  - name: system
    id: 22
    range: [0xff00, 0xffff]
    opcodes:
      - symbol: WASMOS_IPC_SHUTDOWN_REQ
        value: 0xff02
        kind: req
        doc: |
          The system is going down; quiesce and answer WASMOS_IPC_SHUTDOWN_DONE.
          arg0 = reason (0 = halt, 1 = reboot), arg1..arg3 reserved (0).
          Sent by the process manager to every registered driver and service in
          REVERSE spawn order, so a participant still has the services beneath it
          while it quiesces (docs/architecture/15-drivers-and-services.md,
          "Orderly Shutdown Design Direction").
          A participant that does not answer within the deadline is passed over
          and the machine still goes down, which is safe because of what the
          notification exists to do: a filesystem that misses it mounts read-only
          next boot rather than serving inconsistent metadata.
          This subsystem's range is above every other subsystem's because the
          message arrives on the PARTICIPANT's own endpoint, where a
          subsystem-scoped value would collide -- gfx and proc_manager both own
          0x200. It is the band the kernel's IRQ (0xff00) and MSI (0xff01) events
          already use for the same reason; those two stay hand-written in
          src/drivers/include/wasmos_driver_abi.h and src/kernel/include/irq.h.
      - symbol: WASMOS_IPC_SHUTDOWN_DONE
        value: 0xff82
        kind: resp
        doc: |
          Sent back to the process manager when a participant has quiesced.
          arg0..arg3 reserved (0). Answering does not mean the participant stops
          running; it means nothing it holds still needs to reach a device.

  - name: pci
    id: 21
    range: [0xd00, 0xdff]
    opcodes:
      - symbol: PCI_IPC_MSI_QUERY
        value: 0xd00
        kind: req
        doc: |
          Ask what message-signalled interrupt support a PCI function has.
          arg0=bdf ((bus<<8)|(device<<3)|function) arg1..arg3=reserved(0).
          On success: PCI_IPC_RESP, arg0=WASMOS_PCI_MSI_KIND_* (MSIX preferred
          over MSI when both are present), arg1=number of vectors the device
          supports. On failure: PCI_IPC_ERROR, arg1=packed msi domain code.
      - symbol: PCI_IPC_MSI_BIND
        value: 0xd01
        kind: req
        doc: |
          Program one MSI/MSI-X table entry of a PCI function with an
          address/data pair the caller obtained from wasmos_msi_alloc, enable the
          capability, and set INTX_DISABLE so the device stops driving its shared
          INTx line.
          arg0=((bdf<<8)|entry) arg1=address_lo arg2=address_hi arg3=data.
          On success: PCI_IPC_RESP, arg0=entry. On failure: PCI_IPC_ERROR,
          arg1=packed msi domain code.
      - symbol: PCI_IPC_MSI_UNBIND
        value: 0xd02
        kind: req
        doc: |
          Mask one MSI/MSI-X table entry again. Disables the whole capability
          when the last bound entry of the function is released.
          arg0=((bdf<<8)|entry) arg1..arg3=reserved(0).
          On success: PCI_IPC_RESP, arg0=entry. On failure: PCI_IPC_ERROR,
          arg1=packed msi domain code.
      - { symbol: PCI_IPC_RESP, value: 0xd80, kind: resp }
      - { symbol: PCI_IPC_ERROR, value: 0xdff, kind: error }

  - name: volume
    id: 23
    range: [0xe00, 0xeff]
    opcodes:
      - symbol: VOLUME_IPC_IDENTIFY_REQ
        value: 0xe00
        kind: req
        doc: |
          Ask the volume manager to describe one volume into a buffer the CALLER
          owns. arg0 = the volume's `volume` CLASS INSTANCE, arg1 = buffer_id.
          Answered with VOLUME_IPC_IDENTIFY_RESP.

          Same ownership as BLOCK_IPC_IDENTIFY_REQ, and for the same reason: the
          caller acquires the buffer and borrows it to this endpoint with WRITE,
          because the client of a request owns the buffer and the server is a
          transient grantee (architecture/12-dma-transfers.md).

          What a caller wants from this is usually `backing_instance`: a volume
          is not something you read from, it is something that tells you which
          `block` device to read from. The volume manager is deliberately not in
          the I/O path.
      - symbol: VOLUME_IPC_CLAIM_REQ
        value: 0xe01
        kind: req
        doc: |
          Record that the sender has mounted a volume, or release that record.
          arg0 = the volume's class instance, arg1 = 1 to claim and 0 to release.
          Answered with VOLUME_IPC_RESP, arg0 = 0.

          RECORDS a claim; does not enforce one. The volume manager is not in the
          I/O path, so a tool that does not ask is not stopped -- this is what
          `fsck` and `mkfs` consult before touching a volume that may be mounted,
          and enforcing it would mean standing in the data path for every read to
          prevent a mistake only those two can make.
      - { symbol: VOLUME_IPC_IDENTIFY_RESP, value: 0xe80, kind: resp, doc: "arg0 = 0, arg1 = bytes written into the caller's buffer." }
      - { symbol: VOLUME_IPC_RESP, value: 0xe81, kind: resp }
      - { symbol: VOLUME_IPC_ERROR, value: 0xeff, kind: error, doc: "arg0 = packed error code." }
