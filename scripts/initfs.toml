source = "fs_init.wap"

[[entries]]
kind = "wasmos_app"
flags = ["bootstrap"]
path = "system/drivers/fbpci.wap"
source = "framebuffer_pci.wap"

[[entries]]
kind = "wasmos_app"
flags = ["bootstrap"]
path = "system/services/fs_manager.wap"
source = "fs_manager.wap"

[[entries]]
kind = "wasmos_app"
flags = ["bootstrap"]
path = "system/services/device_manager.wap"
source = "device_manager.wap"

# The partition and volume managers are in the INITFS, not on the ESP, because
# /boot is mounted from a volume and a volume does not exist until they have run.
# On the ESP they could only be spawned by the boot rules, which load after /boot
# is already mounted -- the circle this placement breaks.
#
# Both are Zig, which the build already requires: the native gfx-compositor and
# font-service are Zig too, so nothing configures without it.
[[entries]]
kind = "wasmos_app"
flags = ["bootstrap"]
path = "system/drivers/partition_manager.wap"
source = "partition_manager.wap"

[[entries]]
kind = "wasmos_app"
flags = ["bootstrap"]
path = "system/services/volume_manager.wap"
source = "volume_manager.wap"

[[entries]]
kind = "wasmos_app"
flags = ["bootstrap"]
path = "system/services/net_stack.wap"
source = "net_stack.wap"

[[entries]]
kind = "wasmos_app"
path = "apps/net_udp_echo.wap"
source = "net_udp_echo.wap"

[[entries]]
kind = "data"
path = "devmgr/rules/default.rules"
source = "devmgr_rules_init_default.rules"
